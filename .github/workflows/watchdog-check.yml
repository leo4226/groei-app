name: Watchdog dead-man check

# Calls the check endpoint twice an hour, but only during the awake window —
# the endpoint never alerts outside 08:00–23:30 Europe/Amsterdam, so running it
# overnight was pure waste. UTC 6–22 covers the 08:00–23:30 Amsterdam
# awake window year-round; the endpoint still suppresses any call outside the
# exact window. The endpoint owns all
# logic (staleness, awake window, once-per-outage), so frequent calls are safe.
on:
  schedule:
    - cron: "10,40 6-22 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger watchdog check endpoint
        run: |
          curl -fsS -X POST \
            -H "X-Watchdog-Secret: ${{ secrets.WATCHDOG_SECRET }}" \
            https://floreren-api.fly.dev/api/internal/watchdog/check
