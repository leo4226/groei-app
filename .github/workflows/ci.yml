name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# If an agent pushes twice in quick succession, cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check (tsc)
        run: npx tsc --noEmit
      - name: Build (vite)
        # tsc is lenient about JSX nesting that Vite's rolldown parser rejects, so
        # tsc can pass while the production build fails (see PR #91 / issue #102).
        # Run the real build here so that class of error is caught as a PR check,
        # not only as an opaque Vercel deploy failure.
        run: npm run build

  backend:
    name: Backend · safe tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        # The suite runs against the in-memory aiosqlite seam (conftest.py) —
        # no live Postgres needed. The handful of tests that DO need one
        # (test_db_adapter's adapter-vs-asyncpg tests) skip themselves when
        # DATABASE_URL is unreachable.
        run: python -m pytest -q
