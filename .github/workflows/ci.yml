name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# If an agent pushes twice in quick succession, cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tsc:
    name: Frontend · tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check (tsc)
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (vite)
        run: npm run build

  backend:
    name: Backend · safe tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run DB-independent tests
        # --noconftest skips conftest.py, which imports the whole app and needs a
        # live Postgres. These two suites are pure functions (no fixtures). Expand
        # this list once CI provisions a Postgres service.
        run: python -m pytest --noconftest tests/test_plant_suggestions.py tests/test_ecology_enrichment.py -q
