name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# If an agent pushes twice in quick succession, cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Keep this name exactly as-is: branch protection requires a status check
    # literally called "Frontend · tsc + build", so renaming the job removes
    # the required check and blocks every merge until the ruleset is updated
    # to match. Rename both together or neither.
    name: Frontend · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check (tsc)
        run: npx tsc -b --force
      - name: i18n guard (no hardcoded UI strings)
        # Flags user-facing string literals that bypass the typed translation
        # catalog (src/i18n) — the root cause of the 2026-07 NL/EN mixing bugs.
        # Pre-existing offenders are baselined in eslint.i18n.config.js; that
        # list must only shrink. See CLAUDE.md § Languages.
        run: npm run lint:i18n
      - name: Unit tests (vitest)
        # This job used to run tsc + i18n + build only, so the whole frontend
        # suite never gated a PR. Master went red unnoticed when #838 reworded a
        # string the camera tests asserted on (fixed in #843), and every guard in
        # the suite — safe-area anchors, icon uniqueness, payload shape, search
        # matching — was only as good as whoever remembered to run it locally.
        # Uses the package script like every other step here, so the runner is
        # the lockfile-pinned devDependency rather than whatever npx resolves.
        run: npm test

      - name: Build (vite)
        # tsc is lenient about JSX nesting that Vite's rolldown parser rejects, so
        # tsc can pass while the production build fails (see PR #91 / issue #102).
        # Run the real build here so that class of error is caught as a PR check,
        # not only as an opaque Vercel deploy failure.
        run: npm run build

  backend:
    name: Backend · safe tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        # The suite runs against the in-memory aiosqlite seam (conftest.py) —
        # no live Postgres needed. The handful of tests that DO need one
        # (test_db_adapter's adapter-vs-asyncpg tests) skip themselves when
        # DATABASE_URL is unreachable.
        run: python -m pytest -q

  layout:
    # Three mobile bugs reached Leon's phone in one day — a control added only
    # to the desktop header, the same control then clipping its neighbour off
    # the right edge, and a card laid out wrong. tsc, the build, the unit tests
    # and the i18n guard passed on all three, because none of them render
    # anything at a width. This job does.
    name: Frontend · layout
    runs-on: ubuntu-latest
    # Bounded deliberately: the guard drives a real browser, and a stalled
    # navigation would otherwise hold a runner for hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Layout guard (320 / 360 / 393 / 430 / desktop)
        run: node tests/visual/layout-check.mjs
      # Widths were only half the story: the game screens fitted across, and
      # ran off the BOTTOM of an iPhone, so the host had to scroll to reach
      # "Ronde overslaan" with empty space above it.
      - name: Game vertical-fit guard (iPhone heights)
        run: node tests/visual/game-fit-check.mjs

  migrations:
    name: Backend · migrations
    # The test suite runs against the SQLite seam, so nothing here ever
    # executed a migration against real Postgres — migrations were only
    # exercised by the Fly release command, i.e. in production. Migration 0073
    # shipped naming a column on the wrong table (`previous_last_done_by` is on
    # garden_care_operation_members, not garden_care_operations) and the first
    # thing to notice was the aborted deploy. This job runs the whole chain on
    # a throwaway Postgres so a broken migration fails the PR instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: alembic upgrade head
        run: python -m alembic upgrade head
      - name: Re-run head migration (must be idempotent)
        # A release command that fails halfway leaves the deploy to be retried,
        # so the newest migration has to survive being applied twice.
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
