name: Auto-merge

on:
  pull_request:
    # `synchronize` (a push to the PR branch) is here so a transient failure
    # heals itself: if marking ready fails on a rate limit, the next push
    # retries instead of leaving the PR a draft until someone notices.
    # Re-enabling auto-merge on an already-ready PR is a no-op.
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [master]

# Take a PR from "just opened" all the way to master without a human step:
# mark it ready if it was opened as a draft, then squash-merge as soon as all
# required checks pass. A merge to master deploys the backend to Fly, so a
# green PR ships to production — there is no review gate behind this.
permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    # Same-repo branches only. The repo is public, so without this a stranger's
    # fork PR would be marked ready and queued for merge; required checks would
    # still have to pass, but nothing about that is a review. Fork PRs also get
    # no secrets, so DEPLOY_PAT would be empty and the guard below would fail
    # the run on every outside contribution — noise on top of the risk.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready for review
        # Agents are instructed to open PRs as drafts, which left Leon clicking
        # "Ready for review" on every one. The click is what this replaces.
        #
        # It MUST use DEPLOY_PAT, not GITHUB_TOKEN. GitHub does not deliver
        # events caused by GITHUB_TOKEN (the same recursion guard documented in
        # deploy.yml), so a GITHUB_TOKEN-authored ready_for_review would be
        # invisible: pr-review.yml skips drafts, so test-guard — a required
        # check — would never run, and the PR would wait forever for a status
        # that is never reported. Fail loudly instead of creating that.
        if: github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOY_PAT is not set. Marking a PR ready with GITHUB_TOKEN fires no ready_for_review event, so test-guard (required) would never run and this PR would be stuck. Leaving it as a draft."
            exit 1
          fi
          # Retry: the very first run of this workflow died on
          # "API rate limit already exceeded for user ID ...". GitHub's
          # secondary (burst) limit clears in about a minute, and several
          # agents pushing at once hit it easily. A sustained primary-limit
          # exhaustion lasts until the hour rolls over and will still fail
          # here — loudly, which is what we want, since the fallback is Leon
          # clicking Ready in the browser (the web UI does not use this quota).
          for attempt in 1 2 3; do
            if gh pr ready "$PR_URL"; then
              exit 0
            fi
            # Not `[ ... ] && sleep`: the runner's shell is `bash -e`, so on the
            # last iteration the false test would abort the script and swallow
            # the message below.
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::Could not mark PR ready after 3 attempts — see the error above. The PR stays a draft; mark it ready by hand to unblock it."
          exit 1

      - name: Enable auto-merge (squash)
        # Merge with DEPLOY_PAT when present so the resulting push to master is
        # attributed to a real user and triggers the Fly Deploy workflow
        # (GitHub suppresses on:push for GITHUB_TOKEN-authored merges). Falls
        # back to GITHUB_TOKEN if the secret isn't set — auto-merge still works,
        # it just won't auto-deploy the backend.
        #
        # Retried for the same reason as the step above, plus a race this
        # workflow creates for itself: it fires the instant a PR opens or turns
        # ready, which can be before the required checks have registered, and
        # GitHub then rejects the call outright —
        #   Repository rule violations found
        #   Required status check "test-guard" is queued.
        # Seconds later the same call succeeds. Without the retry every PR
        # lands a red X and needs auto-merge enabling by hand, which is the
        # friction this workflow exists to remove.
        #
        # The second failure mode is quota, not timing, and the retries above
        # cannot clear it:
        #   GraphQL: API rate limit already exceeded for user ID <id>.
        # `gh pr merge --auto` is GraphQL-only (GitHub exposes no REST endpoint
        # for enabling auto-merge) and the token's GraphQL budget is hourly, so
        # "already exceeded" means it was spent before this run asked — several
        # agent PRs firing together will do that. The window only rolls over at
        # a fixed time, so 45 seconds of retrying is guaranteed to fail; every
        # time this has fired the PR landed a red X and had to be merged by
        # hand. REST has a SEPARATE budget, so ask REST when the GraphQL window
        # ends and wait it out.
        run: |
          # REST on purpose: it still answers while the GraphQL budget is spent.
          pr_state() {
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state' 2>/dev/null || echo unknown
          }

          for attempt in 1 2 3; do
            if err=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
              exit 0
            fi
            echo "$err"
            # A concurrent merge (another run, or Leon in the browser) leaves
            # nothing to enable — that is success, not a red X.
            if [ "$(pr_state)" != "open" ]; then
              echo "PR is no longer open; there is nothing to enable. Done."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done

          if printf '%s\n' "$err" | grep -q "rate limit already exceeded"; then
            reset=$(gh api rate_limit --jq '.resources.graphql.reset' 2>/dev/null) || reset=0
            case "$reset" in ''|*[!0-9]*) reset=0 ;; esac
            wait_s=$((reset - $(date -u +%s) + 10))
            # Capped at the longest a window can be. Past that, fail loudly
            # rather than idle a runner: runner minutes are free on a public
            # repo, but one red X per PR is exactly what this workflow removes.
            # A reset that has already passed (wait_s <= 0) means the window
            # rolled over while the retries above were sleeping — the budget is
            # back, so just retry.
            if [ "$reset" -gt 0 ] && [ "$wait_s" -le 3600 ]; then
              if [ "$wait_s" -gt 0 ]; then
                echo "GraphQL budget for this token is spent; the window resets in ${wait_s}s. Waiting, then retrying."
                sleep "$wait_s"
              else
                echo "GraphQL budget for this token was spent; the window has already rolled over. Retrying now."
              fi
              if gh pr merge --auto --squash "$PR_URL"; then
                exit 0
              fi
              if [ "$(pr_state)" != "open" ]; then
                echo "PR is no longer open; there is nothing to enable. Done."
                exit 0
              fi
            else
              echo "GraphQL budget is spent and does not reset within the hour (reset=${reset}); not waiting."
            fi
          fi

          echo "::error::Could not enable auto-merge after 3 attempts — see the error above. Merge the PR by hand once its checks are green."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}
