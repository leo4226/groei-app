name: PR review

# VERIFY stage of the agent loop (docs/agents/how-we-work.md §12).
# Two layers, deliberately separate:
#
#  1. test-guard (deterministic, ADVISORY): reports — but no longer fails on —
#     a diff that deletes tests or adds skip/xfail markers.
#
#     It used to block, with a `tests-intentionally-removed` label as the only
#     escape hatch, applied by Leon. That made the suite a one-way ratchet:
#     adding tests was free, removing one needed a human in the loop at exactly
#     the moment nobody was looking, so between 2026-06 and 2026-08 the repo
#     added 149 test files and deleted none
#     (docs/plans/2026-08-21-testing-audit.md §4). The gate was not catching
#     bad deletions; it was preventing all deletions, including the legitimate
#     consolidation that audit identified.
#
#     Leon's call (2026-08-21): he does not want to hand-approve removals, so
#     the label is gone rather than left as a step nobody performs. The grep
#     stays and still reports what went — loudly, in the check output and the
#     job summary. The signal is kept; the gate is dropped.
#
#     THE JOB MUST KEEP RUNNING AND REPORTING. "test-guard" is a required
#     status check in branch protection, so deleting the job would leave every
#     PR waiting forever for a status that never arrives — the same failure
#     mode documented in auto-merge.yml. Always exit 0; never remove the job.
#
#     Nothing automatic replaces the gate. A deletion is visible in the diff,
#     in this check's output, and in the PR body. If test counts start sliding,
#     restore the old behaviour by flipping the `exit 0` below back to `exit 1`
#     and re-adding the OVERRIDE label check — see this file's git history.
#
#  2. deepseek-review (advisory, NON-blocking): an adversarial reviewer —
#     a fresh DeepSeek call that did not write the code — reads the diff
#     and posts findings as a PR comment. Leon stays the merge gate;
#     Claude reviews interactively in sessions.
on:
  pull_request:
    branches: [master]
    # labeled/unlabeled are gone with the override label: nothing here reacts
    # to a label any more, and re-running both jobs on every label edit was
    # pure noise (and an extra LLM call).
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-guard:
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report tests removed or skipped (advisory)
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }}
          # NB: git's default pathspec fnmatch lets * cross '/', so these
          # match nested files too (verified empirically — no :(glob) needed).
          # --ignore-cr-at-eol: a CRLF→LF renormalisation rewrites every line of
          # a file, so a test file that changed only its line endings looked
          # like every test in it had been deleted (172 of them, on the PR that
          # added .gitattributes). Carriage returns are never the reason a test
          # went away.
          diff=$(git diff --ignore-cr-at-eol "$base"...HEAD -- 'backend/tests/**' 'frontend/**/*.test.*')
          removed_tests=$(echo "$diff" | grep -cE '^-\s*((async )?def test_|(it|test|describe)\s*\()' || true)
          added_skips=$(echo "$diff" | grep -cE '^\+.*(pytest\.mark\.skip|pytest\.mark\.xfail|\.skip\(|it\.skip|describe\.skip)' || true)
          echo "removed test functions: $removed_tests; added skip markers: $added_skips"
          if [ "$removed_tests" -gt 0 ] || [ "$added_skips" -gt 0 ]; then
            echo "::warning::This diff removes $removed_tests test function(s) and adds $added_skips skip/xfail marker(s). Advisory only — it does not block the merge. Deleting a test is right when the thing it covered is gone; deleting one because it fails is not. Say in the PR body which tests went and what they covered."
            {
              echo "### :warning: This PR weakens the test suite"
              echo
              echo "- test functions removed: **$removed_tests**"
              echo "- skip/xfail markers added: **$added_skips**"
              echo
              echo "Advisory only — the merge is not blocked. The PR body should say which tests went and what they covered."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Always succeed. Advisory by design, and a required check that never
          # reports a conclusion would hang every PR. Read the header comment
          # at the top of this file before changing this line.
          exit 0

  deepseek-review:
    # The labeled/unlabeled exclusions that used to live here are gone with the
    # override label — this workflow no longer runs on label events at all, so
    # guarding against them was dead weight.
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adversarial review via DeepSeek
        env:
          GH_TOKEN: ${{ github.token }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$NOUS_API_KEY" ]; then echo "NOUS_API_KEY not set — skipping review"; exit 0; fi
          git fetch origin ${{ github.base_ref }}
          # Cap the diff so a huge PR doesn't blow the request (~100KB).
          git diff "origin/${{ github.base_ref }}"...HEAD | head -c 100000 > /tmp/diff.txt
          if [ ! -s /tmp/diff.txt ]; then echo "empty diff — skipping"; exit 0; fi

          # max_tokens must cover the model's REASONING as well as the answer —
          # v4-flash is a reasoning model and returns empty content with
          # finish_reason=length if the budget is too tight (seen at 1200).
          jq -n --rawfile diff /tmp/diff.txt --arg title "$PR_TITLE" '{
            model: "deepseek/deepseek-v4-flash",
            temperature: 0.2,
            max_tokens: 6000,
            messages: [{role: "user", content: ("You are an adversarial code reviewer for the Floreren plant-care app (FastAPI backend, React+TS frontend). You did NOT write this code; your job is to find problems, not to praise. Review the diff for: real bugs, broken edge cases, security issues (auth, secrets, SQL), weakened or missing tests, and deviations from the surrounding code style. Cite file and hunk for every finding. If you find nothing significant, say exactly that in one line — do not invent findings. End with one line: VERDICT: LGTM | NEEDS CHANGES.\n\nPR title: " + $title + "\n\nDiff:\n" + $diff)}]
          }' > /tmp/req.json

          resp=$(curl -fsS --max-time 120 https://inference-api.nousresearch.com/v1/chat/completions \
            -H "Authorization: Bearer $NOUS_API_KEY" -H "Content-Type: application/json" \
            -d @/tmp/req.json) || { echo "LLM call failed — skipping (advisory only)"; exit 0; }
          review=$(echo "$resp" | jq -r '.choices[0].message.content // empty')
          if [ -z "$review" ]; then
            echo "empty review — skipping. finish_reason=$(echo "$resp" | jq -r '.choices[0].finish_reason // "?"'), response head:"
            echo "$resp" | head -c 400
            exit 0
          fi

          marker="<!-- deepseek-review -->"
          body=$(printf '%s\n## 🤖 DeepSeek adversarial review (advisory)\n\n%s\n\n_Re-runs on every push. Not a merge gate — Leon decides._' "$marker" "$review")
          # Update the existing review comment instead of stacking new ones.
          cid=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$cid" -f body="$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "review posted"
