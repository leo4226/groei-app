name: PR review

# VERIFY stage of the agent loop (docs/agents/how-we-work.md §12).
# Two layers, deliberately separate:
#
#  1. test-guard (deterministic, BLOCKING): fails the check if the diff
#     deletes tests or adds skip/xfail markers. Executor agents may add
#     tests, never weaken them — this is the rule a cheap model could
#     otherwise silently break, so it is enforced by grep, not by a model.
#
#  2. deepseek-review (advisory, NON-blocking): an adversarial reviewer —
#     a fresh DeepSeek call that did not write the code — reads the diff
#     and posts findings as a PR comment. Leon stays the merge gate;
#     Claude reviews interactively in sessions.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-guard:
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff must not weaken tests
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }} --depth=1
          diff=$(git diff "$base"...HEAD -- 'backend/tests/**' 'frontend/**/*.test.*')
          removed_tests=$(echo "$diff" | grep -cE '^-\s*(async )?def test_' || true)
          added_skips=$(echo "$diff" | grep -cE '^\+.*(pytest\.mark\.skip|pytest\.mark\.xfail|\.skip\(|it\.skip|describe\.skip)' || true)
          echo "removed test functions: $removed_tests; added skip markers: $added_skips"
          if [ "$removed_tests" -gt 0 ] || [ "$added_skips" -gt 0 ]; then
            echo "::error::This diff removes tests or adds skip/xfail markers. Agents may add tests, never weaken them (how-we-work.md). If this is intentional, Leon must say so in the PR."
            exit 1
          fi

  deepseek-review:
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adversarial review via DeepSeek
        env:
          GH_TOKEN: ${{ github.token }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$NOUS_API_KEY" ]; then echo "NOUS_API_KEY not set — skipping review"; exit 0; fi
          git fetch origin ${{ github.base_ref }} --depth=1
          # Cap the diff so a huge PR doesn't blow the request (~100KB).
          git diff "origin/${{ github.base_ref }}"...HEAD | head -c 100000 > /tmp/diff.txt
          if [ ! -s /tmp/diff.txt ]; then echo "empty diff — skipping"; exit 0; fi

          # max_tokens must cover the model's REASONING as well as the answer —
          # v4-flash is a reasoning model and returns empty content with
          # finish_reason=length if the budget is too tight (seen at 1200).
          jq -n --rawfile diff /tmp/diff.txt --arg title "$PR_TITLE" '{
            model: "deepseek/deepseek-v4-flash",
            temperature: 0.2,
            max_tokens: 6000,
            messages: [{role: "user", content: ("You are an adversarial code reviewer for the Floreren plant-care app (FastAPI backend, React+TS frontend). You did NOT write this code; your job is to find problems, not to praise. Review the diff for: real bugs, broken edge cases, security issues (auth, secrets, SQL), weakened or missing tests, and deviations from the surrounding code style. Cite file and hunk for every finding. If you find nothing significant, say exactly that in one line — do not invent findings. End with one line: VERDICT: LGTM | NEEDS CHANGES.\n\nPR title: " + $title + "\n\nDiff:\n" + $diff)}]
          }' > /tmp/req.json

          resp=$(curl -fsS --max-time 120 https://inference-api.nousresearch.com/v1/chat/completions \
            -H "Authorization: Bearer $NOUS_API_KEY" -H "Content-Type: application/json" \
            -d @/tmp/req.json) || { echo "LLM call failed — skipping (advisory only)"; exit 0; }
          review=$(echo "$resp" | jq -r '.choices[0].message.content // empty')
          if [ -z "$review" ]; then
            echo "empty review — skipping. finish_reason=$(echo "$resp" | jq -r '.choices[0].finish_reason // "?"'), response head:"
            echo "$resp" | head -c 400
            exit 0
          fi

          marker="<!-- deepseek-review -->"
          body=$(printf '%s\n## 🤖 DeepSeek adversarial review (advisory)\n\n%s\n\n_Re-runs on every push. Not a merge gate — Leon decides._' "$marker" "$review")
          # Update the existing review comment instead of stacking new ones.
          cid=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$cid" -f body="$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "review posted"
