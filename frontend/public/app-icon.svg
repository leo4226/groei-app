<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFDF6"/>
          <stop offset="100%" stop-color="#F0E8D0"/>
        </linearGradient>
        <clipPath id="g-clip">
          <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
        </clipPath>
      </defs>
      <g clip-path="url(#g-clip)">
        <rect x="0" y="0" width="100" height="100" fill="url(#g-glass)"/>
        <!-- soft daylight wash from top-left -->
        <ellipse cx="20" cy="10" rx="60" ry="40" fill="#FFF6DC" opacity="0.6"/>
        <!-- muntins -->
        <g stroke="#6B4A35" stroke-width="0.6" opacity="0.55">
          <line x1="33.3" y1="0" x2="33.3" y2="100"/>
          <line x1="66.6" y1="0" x2="66.6" y2="100"/>
          <line x1="0" y1="33.3" x2="100" y2="33.3"/>
          <line x1="0" y1="66.6" x2="100" y2="66.6"/>
        </g>
        <!-- frame perimeter -->
        <rect x="3" y="3" width="94" height="94" rx="19" ry="19"
              fill="none" stroke="#6B4A35" stroke-width="1.2" opacity="0.55"/>
        <!-- subtle glass highlight -->
        <path d="M 6 10 L 28 10 L 6 32 Z" fill="#FFFFFF" opacity="0.35"/>
        <path d="M 38 36 L 60 36 L 38 58 Z" fill="#FFFFFF" opacity="0.18"/>
      </g>
</svg>
