<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jaarquiz</title>
<!--
  Jaarquiz — a ranking quiz for a group of friends. Standalone on purpose: it
  is not part of the plant app and loads nothing from it, and it loads no
  third-party scripts, because this page shares floreren.app's origin (and so
  the admin's login token in localStorage).
  Backend: backend/routers/jaarquiz.py. Names, photos and questions come from
  the database (the repo is public), loaded by the admin at #beheer.
  Participants: /jaarquiz#<invite code>. Dutch only: it is a private party game.
-->
<style>
  :root{
    --bg:#14121f; --panel:#1e1b2e; --panel2:#272340; --line:#36315a;
    --text:#f3f0ff; --muted:#a39dc4; --accent:#ffcc4d; --accent2:#ff6f91; --good:#5ee6a8;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  nav button.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
  h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px;font-weight:800}
  h2{font-size:18px;margin:0 0 10px;font-weight:700}
  p{color:var(--muted);line-height:1.5;margin:0 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .btn{background:var(--accent);color:#1b1630;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.small{width:auto;padding:7px 12px;font-size:13px}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .pick{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:10px;font:inherit;font-size:15px;cursor:pointer;text-align:left}
  .pick.on{border-color:var(--accent);background:#3a3050}
  .pick:disabled{opacity:.35;cursor:default}
  .pick small{color:var(--muted);font-size:12px;margin-left:auto}
  .av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text)}
  .progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .qnum{color:var(--accent);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
  .sub{color:var(--accent);font-weight:600}
  .rank{display:grid;grid-template-columns:30px 1fr;gap:8px;margin-bottom:6px}
  .nums,.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .nums li{height:50px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
  .nums li:first-child{color:var(--accent)}
  .nums li:last-child{color:var(--accent2)}
  .list{position:relative}
  .list li{height:50px;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 10px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;position:relative}
  .list li.dragging{z-index:5;border-color:var(--accent);background:#3a3050;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:grabbing}
  .list li.shift{transition:transform .15s}
  .list li .grip{color:var(--muted);font-size:18px;line-height:1}
  .list li .nm{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list li .mv{background:transparent;border:0;color:var(--muted);font-size:14px;width:32px;height:40px;border-radius:8px;cursor:pointer;touch-action:manipulation}
  .list li .mv:active{background:var(--line)}
  .list li.me .nm::after{content:" (jij)";color:var(--muted);font-weight:400;font-size:13px}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 14px 38px}
  .err{background:#4a1f2e;border:1px solid var(--accent2);color:#ffd6e0;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
  .note{background:#2b2540;border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
  .big{font-size:56px;text-align:center;margin:10px 0}
  .res{list-style:none;margin:0;padding:0}
  .res li{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:5px 0}
  .res .pos{font-weight:800;color:var(--muted);text-align:center}
  .res li:first-child .pos{color:var(--accent)}
  .res .barwrap{position:relative;height:30px;background:var(--panel2);border-radius:8px;overflow:hidden}
  .res .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4b3f7a,#6a55b0);border-radius:8px}
  .res li:first-child .bar{background:linear-gradient(90deg,#b8862a,var(--accent))}
  .res .who{display:flex;align-items:center;gap:8px;position:relative;height:30px;padding-left:4px;font-weight:600;font-size:14px}
  .res .who .av{width:24px;height:24px;font-size:11px}
  .res li:first-child .who{color:#1b1630}
  .res .avg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .meta{font-size:13px;color:var(--muted);margin-top:10px}
  .meta b{color:var(--text)}
  textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
  .toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin:6px 0 12px}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.r{text-align:right;color:var(--muted)}
  .ok{color:var(--good)!important}
  code.link{display:block;word-break:break-all;background:var(--panel2);padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(10,8,20,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
  .modal .box{background:var(--panel);border:2px solid var(--accent2);border-radius:18px;padding:24px 20px;max-width:340px;text-align:center;animation:shake .45s}
  .modal .box .big{margin:0 0 6px}
  .modal .box h2{font-size:24px;margin:0 0 16px}
  /* Question screen: one phone screen, no scrolling. The list takes whatever
     height is left and its ten rows share it (30-64 px each), so it fits an
     iPhone SE as well as a Pro Max. Numbers and names are two columns of
     equal flex rows, so they stay aligned at any height. */
  body.qmode .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}
  body.qmode header{margin-bottom:8px}
  body.qmode .logo{font-size:16px}
  body.qmode main{flex:1;min-height:0;display:flex;flex-direction:column}
  .qview{flex:1;min-height:0;display:flex;flex-direction:column}
  .qview .progress{margin-bottom:8px;flex:none}
  .qview .qnum{font-size:12px}
  .qview h1{font-size:clamp(19px,5.6vw,25px);margin:2px 0 8px}
  .qview .sub{margin:-4px 0 8px}
  .qview .rank{flex:1;min-height:0;margin-bottom:4px}
  .qview .nums,.qview .list{height:100%;gap:5px}
  .qview .nums li,.qview .list li{height:auto;flex:1 1 0;min-height:30px;max-height:64px}
  .qview .list li .av{width:28px;height:28px}
  .qview .ends{margin:0 0 8px 38px;flex:none}
  .qview .row .btn{padding:12px 14px}
  .qview .row{flex:none}
  .ends .top{color:var(--accent);font-weight:700}
  .ends .bottom{color:var(--accent2);font-weight:700}
  .qnum .drag{float:right;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  /* Presentation mode (#presenteer): Leon's laptop or a TV on quiz night. */
  body.present{background:radial-gradient(1200px 700px at 50% -10%,#3a2a6a 0%,var(--bg) 60%);overflow:hidden}
  body.present .wrap{max-width:none;height:100vh;height:100dvh;padding:2.5vh 4vw;display:flex;flex-direction:column}
  body.present header{display:none}
  body.present main{flex:1;min-height:0;display:flex;flex-direction:column}
  .show{flex:1;min-height:0;display:flex;flex-direction:column;user-select:none;cursor:pointer}
  .show.watching{cursor:default;overflow:auto}
  #live-status:empty{display:none}
  .show .bonus-photo{width:100%;height:min(58dvh,680px);object-fit:contain;filter:drop-shadow(0 0 24px #d85bc9)}
  .show .bonus-portrait{width:100%;display:grid;place-items:center}
  .show .bonus-portrait img{grid-area:1/1}
  .show .bonus-portrait .incoming{animation:bonus-fade .75s ease-in-out}
  @keyframes bonus-fade{from{opacity:0}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.show .bonus-portrait .incoming{animation:none}}
  .pokemon-panel{position:relative;width:min(100%,calc(68dvh * 16 / 9));aspect-ratio:16/9;overflow:hidden}
  .pokemon-panel img{position:absolute;inset:0 auto auto 0;width:100%;height:200%;max-width:none}
  .pokemon-panel.answer img{top:-100%}
  .bonus-art{position:absolute;inset:0;overflow:hidden}
  .pokemon-panel.entrance{background:radial-gradient(ellipse at 28% 52%,#d9faff 0%,#5bc6e5 24%,transparent 58%),linear-gradient(120deg,#5bc6e5 24%,#cf1727 62%,#eb423b)}
  .pokemon-panel.entrance .bonus-art{animation:bonus-silhouette 1.2s both}
  .bonus-ball{position:absolute;left:30%;top:53%;z-index:2;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);animation:bonus-ball-flight 1.2s both;pointer-events:none}
  .bonus-ball::before,.bonus-ball::after{content:"";position:absolute;left:0;right:0;height:50%;border:clamp(2px,.45vw,7px) solid #171521;background:#ed253b;box-shadow:inset 0 6px 10px #fff6}
  .bonus-ball::before{top:0;border-radius:100% 100% 0 0 / 200% 200% 0 0;animation:bonus-ball-open 1.2s both}
  .bonus-ball::after{bottom:0;border-radius:0 0 100% 100% / 0 0 200% 200%;background:#fff8ee}
  .bonus-ball span{position:absolute;left:50%;top:50%;z-index:1;transform:translate(-50%,-50%);width:35%;aspect-ratio:1;border-radius:50%;background:#fff8ee;border:clamp(2px,.38vw,6px) solid #171521}
  .bonus-flash{position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 30% 53%,white 2%,#d5fcff 13%,transparent 52%);animation:bonus-flash 1.2s both;pointer-events:none}
  @keyframes bonus-ball-flight{
    0%{opacity:1;transform:translate(620%,130%) rotate(260deg) scale(.55)}
    35%{transform:translate(235%,-135%) rotate(110deg) scale(.8)}
    59%,76%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
    91%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}
  }
  @keyframes bonus-ball-open{0%,62%{transform:none}79%,100%{transform:translate(-8%,-45%) rotate(-23deg)}}
  @keyframes bonus-flash{0%,62%,100%{opacity:0}72%{opacity:1}}
  @keyframes bonus-silhouette{
    0%,65%{opacity:0;clip-path:circle(0 at 30% 53%)}
    74%{opacity:1;clip-path:circle(22% at 30% 53%)}
    100%{opacity:1;clip-path:circle(100% at 30% 53%)}
  }
  @media(prefers-reduced-motion:reduce){
    .pokemon-panel.entrance .bonus-art{animation:none}
    .bonus-ball,.bonus-flash{display:none}
  }
  .music-dock{position:fixed;right:12px;top:12px;z-index:50;width:200px;height:200px;background:#181322;border:1px solid var(--line)}
  .music-dock[hidden]{display:none}
  .music-dock iframe{width:100%;height:100%;border:0}
  body.music-playing.present .wrap{padding-right:232px}
  @media(max-width:700px){
    body.music-playing.present{overflow:auto}
    body.music-playing.present .wrap{padding:224px 4vw 2.5vh;height:auto;min-height:100dvh}
    body.music-playing.present .music-dock{position:absolute}
  }
  body.present .show .bar{flex-wrap:wrap;gap:8px;flex-shrink:0}
  body.present:has(.waiting-arena){overflow:hidden}
  body.present .wrap:has(.waiting-arena){padding:0;height:100dvh;min-height:0}
  .waiting-screen{position:relative}
  .waiting-arena{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 40% 52%,#35236b,#14132a 78%);border:2px solid #a293d1}
  .waiting-circle{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:hsl(var(--hue) 85% 65%);box-shadow:0 0 14px #0007;pointer-events:none}
  .waiting-circle.mine{outline:2px solid white;outline-offset:3px;pointer-events:auto;cursor:grab}
  .waiting-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}
  .btn.launch{background:#178044;color:white;border:2px solid #60e593}
  .waiting-circle.mine:active{cursor:grabbing}
  .waiting-circle{transition:opacity .32s ease}
  .waiting-circle.out{opacity:0;pointer-events:none}
  .waiting-screen .bar{right:12px;display:flex;flex-wrap:wrap;background:#17152ce8;padding:8px}
  @media(prefers-reduced-motion:reduce){.waiting-circle{transition:none}}
  .waiting-heading{position:absolute;left:12px;top:12px;max-width:min(55vw,360px);z-index:1;pointer-events:none;text-shadow:0 2px 8px #000}
  .waiting-heading h1{font-size:clamp(20px,4vw,36px)}
  .waiting-screen .bar,.waiting-screen [role=status]{position:absolute;left:12px;bottom:16px;z-index:2}
  .waiting-screen [role=status]{bottom:48px}
  body.music-playing:has(.waiting-arena) .music-dock{position:fixed}
  .show .bonus-winner{color:var(--accent)}
  .bonus-preview{width:min(92vw,1000px);max-height:92dvh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px}
  .bonus-preview::backdrop{background:#000b}
  .show .kicker{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(14px,1.6vw,22px)}
  .show h1{font-size:clamp(28px,4.2vw,64px);margin:.6vh 0 1.6vh;line-height:1.08}
  .show .labels{display:flex;justify-content:space-between;font-size:clamp(14px,1.5vw,22px);margin-bottom:1vh}
  .show .labels .top{color:var(--accent);font-weight:700}
  .show .labels .bottom{color:var(--accent2);font-weight:700}
  .show ol{list-style:none;margin:0;padding:0;flex:1;min-height:0;display:flex;flex-direction:column;gap:.8vh}
  .show ol li{flex:1 1 0;min-height:48px;display:flex;align-items:center;gap:1.4vw;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:0 1.6vw;font-size:clamp(16px,3.1vh,42px);font-weight:700;transition:transform .35s,background .35s}
  .show ol li .p{width:2.4em;color:var(--muted);font-weight:800}
  .show ol li .av{width:clamp(28px,4.6vh,64px);height:clamp(28px,4.6vh,64px);font-size:clamp(12px,2vh,26px)}
  .show ol li .a{margin-left:auto;color:var(--muted);font-weight:500;font-size:.8em}
  .show ol li.hidden{color:var(--muted);background:transparent;border-style:dashed}
  .show ol li.new{animation:podium-arrival .55s ease-out}
  @keyframes podium-arrival{from{opacity:.3;transform:translateY(.55em) scale(.96)}to{opacity:1;transform:none}}
  .show ol li.new .p{filter:drop-shadow(0 0 .25em #ffdd79)}
  @media(prefers-reduced-motion:reduce){.show ol li.new{animation:none}}
  .show ol li.win{background:linear-gradient(90deg,#b8862a,var(--accent));color:#1b1630;border-color:var(--accent);transform:scale(1.02)}
  .show ol li.win .p,.show ol li.win .a{color:#1b1630}
  .show ol li.drum{animation:drum .12s infinite;color:var(--accent)}
  .show .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
  .show .center h1{font-size:clamp(36px,6vw,96px)}
  .show .center p{font-size:clamp(16px,2vw,28px)}
  .show .award{display:flex;align-items:center;gap:2vw;font-size:clamp(18px,2.6vw,38px);font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:2vh;padding:1.6vh 2vw;width:min(90vw,1100px)}
  .show .award .what{color:var(--muted);font-weight:500;font-size:.7em}
  .show .award .av{width:clamp(36px,6vh,80px);height:clamp(36px,6vh,80px)}
  .show .award.hidden{opacity:.25}
  .show .bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(12px,1.3vw,18px);margin-top:1.2vh}
  .show .bar button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:.6vh 1.4vw;font:inherit;cursor:pointer}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  @keyframes drum{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  .clown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:65;pointer-events:none;font-size:min(48vw,260px);animation:clown 1.4s forwards}
  @keyframes clown{0%{transform:scale(.2) rotate(-20deg);opacity:0}20%{transform:scale(1.1) rotate(8deg);opacity:1}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.4);opacity:0}}
  .loadbar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:4px 0 16px}
  .loadbar > div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
  .modal .box p{color:var(--muted);margin:0 0 6px}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">Jaar<span>.</span>quiz ✨🤖</div>
    <nav id="nav"></nav>
  </header>
  <main id="app"><div class="card"><p>Laden…</p></div></main>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<script>
"use strict";
const ERRORS = {
  quiz_not_found: "Deze quizlink klopt niet (meer). Vraag om de nieuwe link.",
  voter_taken: "Die naam is al gekozen. Ben jij het echt? Vraag dan de beheerder om hem vrij te geven.",
  unknown_voter: "Die naam staat niet in de quiz.",
  token_invalid: "Je sessie is verlopen of je naam is vrijgegeven. Kies je naam opnieuw.",
  token_required: "Kies eerst wie je bent.",
  invalid_order: "Er ging iets mis met de volgorde. Herlaad de pagina.",
  quiz_closed: "De uitslag is al bekend, dus je kunt niets meer aanpassen.",
  not_revealed: "De uitslag is nog geheim.",
  config_too_large: "De configuratie is te groot (te veel of te grote foto's).",
};

/* ---------- helpers ---------- */
const app = document.getElementById("app"), navEl = document.getElementById("nav");
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}

let audio = null;

      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900;
      const g = ctx.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + len);

    const crash = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
    const cd = crash.getChannelData(0); for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / cd.length, 2);

    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
    const g = ctx.createGain(); g.gain.value = .5;
    src.connect(hp).connect(g).connect(ctx.destination); src.start(now + seconds);
  }catch(e){}
}

  list.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dy = ev.clientY - drag.startY;
    const n = drag.items.length;
    const to = Math.max(0, Math.min(n - 1, drag.from + Math.round(dy / drag.step)));
    drag.li.style.transform = `translateY(${dy}px)`;
    if (to !== drag.to){
      drag.to = to;
      drag.items.forEach((x, i) => {
        if (x === drag.li) return;
        let shift = 0;
        if (drag.from < to && i > drag.from && i <= to) shift = -drag.step;
        if (drag.from > to && i < drag.from && i >= to) shift = drag.step;
        x.style.transform = shift ? `translateY(${shift}px)` : "";
      });
    }
  });
  const end = () => {
    if (!drag) return;
    const { li, from, to, items } = drag; drag = null;
    items.forEach(x => { x.style.transform = ""; x.classList.remove("shift", "dragging"); });
    if (to !== from){
      const ref = items.filter(x => x !== li)[to];
      list.insertBefore(li, ref || null);
      onChange();
    }
  };
  list.addEventListener("pointerup", end);
  list.addEventListener("pointercancel", end);
}

function vQuestion(){
  const q = quiz.questions[qi];
  const opts = optionsFor(q);
  const order = drafts[q.id] || cleanOrder(mine.answers[q.id] || shuffle(opts), opts);
  drafts[q.id] = order;
  const nums = el("ol", { class: "nums" }, order.map((_, i) => el("li", {}, i + 1)));
  const list = el("ul", { class: "list" });
  const liar = quiz.liar && !q.options ? quiz.liar.name : null;
  let prev = order.slice();
  const sync = () => {
    const cur = [...list.children].map(li => li.dataset.name);
    if (liar && !liarDone && cur[cur.length - 1] === liar && prev[prev.length - 1] !== liar){
      markLiar(); drafts[q.id] = prev; render(); showLiar(); return;
    }
    if (!q.options && cur[0] === mine.voter && prev[0] !== mine.voter && once("clown")) showClown();
    drafts[q.id] = cur; prev = cur.slice();
  };
  const move = (li, dir) => {
    const sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
    if (!sib) return;
    dir < 0 ? list.insertBefore(li, sib) : list.insertBefore(sib, li);
    sync();
  };
  order.forEach(n => {
    const up = el("button", { class: "mv", "aria-label": "omhoog" }, "▲");
    const down = el("button", { class: "mv", "aria-label": "omlaag" }, "▼");
    const li = el("li", { class: (!q.options && n === mine.voter) ? "me" : "", "data-name": n },
      el("span", { class: "grip" }, "⠿"), av(n), el("span", { class: "nm" }, n), up, down);
    up.addEventListener("click", e => { e.stopPropagation(); move(li, -1); });
    down.addEventListener("click", e => { e.stopPropagation(); move(li, 1); });
    list.append(li);
  });
  makeSortable(list, sync);

  const last = qi === quiz.questions.length - 1;
  const next = async dir => {
    sync();
    const cur = drafts[q.id];
    if (dir > 0 && liar && !liarDone && cur[cur.length - 1] === liar){ markLiar(); showLiar(); return; }
    const answers = { ...mine.answers, [q.id]: cur.slice() };
    busy = true; errorMsg = "";
    try{
      mine = await api("PUT", `/${encodeURIComponent(CODE)}/me`, { answers, done: dir > 0 && last }, { "X-Quiz-Token": session.token });
    }catch(e){
      busy = false; errorMsg = e.message;
      if (e.code === "token_invalid"){ store(KEY, null); session = null; mine = null; view = "intro"; }
      render(); return;
    }
    busy = false;
    const half = Math.ceil(quiz.questions.length / 2) - 1;
    if (dir > 0 && qi === half && once("analyse"))
      await fakeLoading("AI analyseert je antwoorden… 🤖✨", 2600, "Resultaat: 87% match met Quint 🧠✨");
    if (dir > 0 && last && mine.done) await fakeLoading("Statistieken vervalsen net als vorige keer… 📊🤫", 2200);
    if (dir > 0 && last){
      if (mine.done){ view = "done"; setTimeout(() => confetti(), 50); }
      else { qi = firstOpen(); errorMsg = "Je hebt nog niet alle vragen ingevuld."; }
    } else qi = Math.max(0, Math.min(quiz.questions.length - 1, qi + dir));
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  };
  return el("div", { class: "qview" },
    el("div", { class: "progress" }, el("div", { style: `width:${(qi / quiz.questions.length) * 100}%` })),
    el("div", { class: "qnum" }, `Vraag ${qi + 1} van ${quiz.questions.length} ✨`, el("span", { class: "drag" }, "sleep 👆 of ▲▼")),
    el("h1", {}, q.text),
    q.sub ? el("p", { class: "sub" }, q.sub) : null,
    el("div", { class: "rank" }, nums, list),
    el("div", { class: "ends" }, el("span", { class: "top" }, "⬆️ " + (q.top || "meest")), el("span", { class: "bottom" }, (q.bottom || "minst") + " ⬇️")),
    (() => {
      const prevBtn = (cls) => el("button", { class: cls, disabled: qi === 0 || busy, onclick: () => next(-1) }, "⬅️ Vorige");
      const nextBtn = (cls) => el("button", { class: cls, disabled: busy, onclick: () => next(1) }, last ? "Insturen 🚀🎉💯" : "Volgende ➡️✨");
      // From the second half on the buttons swap places and colours. Pesten.
      return qi >= Math.ceil(quiz.questions.length / 2)
        ? el("div", { class: "row" }, nextBtn("btn ghost"), prevBtn("btn"))
        : el("div", { class: "row" }, prevBtn("btn ghost"), nextBtn("btn"));
    })());
}

async function bonusPhoto(file){
  if (!["image/jpeg","image/png","image/webp"].includes(file.type)) throw new Error("image type");
  const bitmap = await createImageBitmap(file);
  try{
    const scale = Math.min(1, 1500 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", .88);
  }finally{ bitmap.close(); }
}
async function playBonus(bonus, show, active = () => true){
  const frames = (bonus.ages || []).filter(Boolean);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!frames.length || reduced){
    if (active()) show({ type: "bonusWinner", bonus });
    return;
  }
  const durations = frames.map((_, i) => i ? 1400 : 2000);
  drumroll(durations.reduce((total, ms) => total + ms, 0) / 1000);
  for (const [i, photo] of frames.entries()){
    if (!active()) return;
    show({ type: "bonusAge", photo, previous: frames[i - 1] });
    await new Promise(resolve => setTimeout(resolve, durations[i]));
  }
  if (active()) show({ type: "bonusWinner", bonus });
}

function sayBonusName(name, after){
  if (!name || !("speechSynthesis" in window)){ after(); return; }
  const line = new SpeechSynthesisUtterance("It’s " + name + "!");
  line.lang = "en-US";
  line.pitch = 1.25;
  line.rate = 1.04;
  speechSynthesis.cancel();
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    clearTimeout(fallback);
    after();
  };
  const fallback = setTimeout(done, 2200);
  line.onend = line.onerror = done;
  speechSynthesis.speak(line);
}

  const R = rehearsal ? {
    participants: 3,
    questions: Q.map(q => ({ id: q.id, rows: ["Voorbeeld A", "Voorbeeld B", "Voorbeeld C"].map((name, i) =>
      ({ name, avg: 1.2 + i * .8, min: 1, max: i + 1 })) })),
    self_knowledge: [{name:"Voorbeeld A",off_by:.4},{name:"Voorbeeld C",off_by:1.7}],
  } : admin.results;
  presentationResults = R;
  slides = [{ type: "intro" }];
  const savedBonus = store(BONUS_KEY);
  const bonus = rehearsal && !(savedBonus?.photo || savedBonus?.pokemon)
    ? demoBonus(Math.min(7, Q.length)) : savedBonus;
  Q.forEach((q, i) => {
    const res = R.questions.find(row => row.id === q.id);
    if (res?.rows.length){
      const podium = { rows: res.rows.slice(0, 3) };
      for (let k = 0; k <= podium.rows.length; k++) slides.push({ type: "q", res: podium, q, shown: k });
    }
    if (bonus?.after === i + 1 && (bonus.photo || bonus.pokemon)){
      slides.push({ type: "bonus", bonus });
      if (bonus.pokemon) slides.push({ type: "bonusSilhouette", bonus });
      slides.push({ type: "bonusWinner", bonus });
    }
  });
  const own = R.questions.filter(r => !(Q.find(q => q.id === r.id) || {}).options);
  const count = (pick) => { const c = {}; own.forEach(r => { const row = pick(r.rows); if (row) c[row.name] = (c[row.name] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]; };
  const first = count(rows => rows[0]), lastc = count(rows => rows[rows.length - 1]);
  let split = null;
  R.questions.forEach(r => r.rows.forEach(row => { const d = row.max - row.min; if (!split || d > split.d) split = { d, row, q: Q.find(q => q.id === r.id) }; }));
  const sk = R.self_knowledge;
  const awards = [];
  if (first) awards.push({ e: "🏆👑", t: "Vaakst op #1", name: first[0], what: `${first[1]}× bovenaan` });
  if (lastc) awards.push({ e: "🧊🫠", t: "Vaakst onderaan", name: lastc[0], what: `${lastc[1]}× op de laatste plek` });
  if (split) awards.push({ e: "🔥🤯", t: "Meeste ruzie", name: split.row.name, what: `van #${split.row.min} tot #${split.row.max} bij "${split.q ? split.q.text : ""}"` });
  if (sk.length) awards.push({ e: "🪞🧘", t: "Kent zichzelf het best", name: sk[0].name, what: `${sk[0].off_by.toFixed(1)} plekken ernaast` });
  if (sk.length > 1) awards.push({ e: "🤡🌈", t: "Leeft in een droomwereld", name: sk[sk.length - 1].name, what: `${sk[sk.length - 1].off_by.toFixed(1)} plekken ernaast` });
  for (let k = 0; k <= awards.length; k++) slides.push({ type: "awards", awards, shown: k });
  slides.push({ type: "end" });
}
let liveSlide = null, liveStatus = "", publishQueue = Promise.resolve();
async function copyInviteLink(){
  try{ await navigator.clipboard.writeText(inviteLink(admin.join_code)); toast("Uitnodigingslink gekopieerd"); }
  catch(e){ toast("Kopiëren lukte niet"); }
}
function currentFrame(){
  const sl = slides[si];
  if (sl.bonus) return bonusFrame || sl;
  if (sl.type === "intro") return {
    type: "intro", title: quiz.title,
    participants: presentationResults.participants, total: quiz.questions.length,
  };
  if (sl.type === "q") return {
    type: "q", text: sl.q.text, top: sl.q.top, number: quiz.questions.indexOf(sl.q) + 1,
    total: quiz.questions.length, drumming,
    rows: sl.res.rows.map((row, i, rows) =>
      i >= rows.length - sl.shown && !(i === 0 && drumming) ? { name: row.name } : null),
  };
  if (sl.type === "awards") return {
    type: "awards", awards: sl.awards.map((award, i) => i < sl.shown ? award : null),
  };
  return { type: "end" };
}
function publish(slide){
  if (rehearsal) return Promise.resolve(true);
  // Only ordinary presentation frames may leave the presenter browser.
  if (slide && !["intro", "q", "awards", "end"].includes(slide.type)) return Promise.resolve(true);
  publicFrame = slide;
  const payload = slide && { ...slide, music: hostMusic, fadeEnd };
  publishQueue = publishQueue.then(async () => {
    try{
      await api("PUT", "/admin/presentation", { join_code: admin.join_code, slide: payload }, adminHeaders());
      liveStatus = "";
      return true;
    }catch(e){
      liveStatus = "Live verbinden mislukt. Probeer opnieuw.";
      return false;
    }finally{
      const status = document.getElementById("live-status");
      if (status) status.textContent = liveStatus;
    }
  });
  return publishQueue;
}
function showFrame(){
  render();
  publish(currentFrame());
}
async function stopPresentation(){
  if (drumming || view !== "present") return;
  if (rehearsal){
    rehearsal = false; view = "admin"; hostMusic = false; pokemonSound(); clearRoom(); render();
    return;
  }
  view = "stopping";
  pokemonSound();
  syncMusic();
  if (await publish(null)) location.hash = "beheer";
  else { view = "present"; render(); }
}
async function pollLive(){
  try{
    const { slide, circles: snapshot = {} } = await api("GET", `/${encodeURIComponent(CODE)}/presentation`);
    if (liveStatus || JSON.stringify(slide) !== JSON.stringify(liveSlide)){
      liveStatus = "";
      if (listenerMusic && slide?.type === "q" && !slide.drumming){
        const place = slide.rows.findIndex(Boolean);
        const previous = liveSlide?.type === "q" && liveSlide.number === slide.number ? liveSlide.rows.findIndex(Boolean) : -1;
        if (place >= 0 && (previous < 0 || place < previous)) podiumCue(place);
      }
      liveSlide = slide;
      render();
    }
    if (slide?.type === "intro"){
      reconcileCircles(snapshot);
      const own = circles.get(visitorId);
      if (own && Date.now() >= nextHeartbeat){
        const moving = drag || Math.hypot(own.vx, own.vy) > .035;
        nextHeartbeat = Date.now() + (moving ? 850 : 4200);
        sendCircle(own);
      }
    } else if (circles.size){
      clearRoom();
    }
  }catch(e){
    if (LIVE || liveSlide){
      liveStatus = e.code === "quiz_not_found" ? e.message : "Verbinding verbroken. Opnieuw verbinden…";
      if (e.code === "quiz_not_found") liveSlide = null;
      render();
    }
    if (e.code === "quiz_not_found") return;
  }
  setTimeout(pollLive, liveSlide?.type === "intro" ? 850 : LIVE || liveSlide ? 1500 : 4000);
}
function podiumCue(place){
  try{
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume().catch(()=>{});
    const notes = [[72,76,79,84],[62,69,74],[55,60]][place] || [60];
    notes.forEach((note,i)=>{
      const time = audio.currentTime + i*.105;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = place === 2 ? "sine" : "triangle";
      osc.frequency.setValueAtTime(440*2**((note-69)/12),time);
      gain.gain.setValueAtTime(.001,time); gain.gain.exponentialRampToValueAtTime(.14,time+.02);
      gain.gain.exponentialRampToValueAtTime(.001,time+.33);
      osc.connect(gain).connect(audio.destination); osc.start(time); osc.stop(time+.34);
    });
    if (place === 1 && window.speechSynthesis){
      const cheer = new SpeechSynthesisUtterance("Ooooh!"); cheer.pitch=1.32; cheer.rate=.85;
      window.speechSynthesis.speak(cheer);
    }
  }catch(e){}
}
function step(dir){
  if (drumming) return;
  const nextI = Math.max(0, Math.min(slides.length - 1, si + dir));
  if (nextI === si) return;
  const s2 = slides[nextI];
  if (dir > 0 && s2.type === "q" && s2.shown && !faded){
    faded = true; if (hostMusic){ fadeEnd = Date.now()+4500; hostMusic = false; }
  }
  if (slides[si].type === "bonusSilhouette" || s2.type === "bonusSilhouette") pokemonSound(s2.type === "bonusSilhouette");
  if (dir > 0 && s2.type === "bonusWinner" && !s2.bonus.pokemon && s2.bonus.ages?.some(Boolean)){
    drumming = true; si = nextI;
    playBonus(s2.bonus, frame => {
      const finished = frame.type === "bonusWinner";
      bonusFrame = finished ? null : frame;
      drumming = !finished;
      showFrame();
      if (finished) confetti(5200, BONUS_EMOJI, true);
    });
    return;
  }
  // The step that reveals #1: drumroll first.
  if (dir > 0 && ((s2.type === "bonusWinner" && !s2.bonus.pokemon) || (s2.type === "q" && s2.shown === s2.res.rows.length))){
    drumming = true; si = nextI; showFrame(); drumroll(1.6);
    setTimeout(() => {
      drumming = false; showFrame();
      if (s2.type === "bonusWinner") confetti(5200, BONUS_EMOJI, true);
      else { podiumCue(0); confetti(4200, PODIUM_EMOJI[0], true); }
    }, 1600);
    return;
  }
  si = nextI; showFrame();
  if (dir > 0 && s2.type === "bonusWinner" && s2.bonus.pokemon){
    sayBonusName(s2.bonus.name, () => {
      if (view === "present" && slides[si] === s2) confetti(4500, ["🎆", "🎇", "💥", "✨", ...BONUS_EMOJI], true);
    });
  }
  if (dir > 0 && s2.type === "q" && s2.shown){
    const place = s2.res.rows.length - s2.shown;
    podiumCue(place); confetti(2300, PODIUM_EMOJI[place]);
  }
  if (dir > 0 && s2.type === "end") confetti(6000);
}
function rehearsalJump(){
  const select = el("select", { "aria-label":"Spring naar een onderdeel", disabled:drumming });
  select.append(el("option", { value:"" }, "Spring naar…"));
  slides.forEach((slide, index) => {
    let label;
    if (slide.type === "intro") label = "Wachtkamer";
    if (slide.type === "q" && !slide.shown) label = "Vraag " + (quiz.questions.indexOf(slide.q) + 1);
    if (slide.type === "bonus") label = "Geheime bonus";
    if (slide.type === "awards" && !slide.shown) label = "Prijzen";
    if (slide.type === "end") label = "Afsluiting";
    if (label) select.append(el("option", { value:String(index) }, label));
  });
  select.onchange = () => {
    if (!rehearsal || drumming || select.value === "") return;
    pokemonSound(); si = Number(select.value); bonusFrame = null; showFrame();
  };
  return select;
}
function vPresent(){
  const frame = currentFrame();
  const wrap = rehearsal && frame.type === "intro" ? waitingFrame("Privé oefenen · wachtkamer") : renderFrame(frame, true);
  wrap.append(el("div", { class: "bar" },
    el("button", { onclick: () => step(-1) }, "⬅️ terug"),
    el("span", {}, `${rehearsal ? "Privé oefenen · " : ""}${si + 1} / ${slides.length}`),
    el("button", { onclick: () => step(1) }, "Verder →"),
    el("button", { onclick: () => {
      fadeEnd = 0; hostMusic = !hostMusic;
      render();
      publish(publicFrame);
    } }, hostMusic ? "■ Stop muziek" : "▶ Paloma Blanca"),
    rehearsal ? rehearsalJump() : el("button", { onclick: () => copyInviteLink() }, "Kopieer uitnodigingslink"),
    rehearsal ? null : el("button", { onclick: () => publish(currentFrame()) }, "Synchroniseer"),
    el("button", { onclick: stopPresentation }, "✖️ stop")));
  wrap.append(el("p", { id: "live-status", role: "status" }, liveStatus));
  return wrap;
}
function vLive(){
  if (liveSlide){
    const frame = liveSlide.type === "intro" ? waitingFrame(liveSlide.title) : renderFrame(liveSlide, false);
    if (liveSlide.music || liveSlide.type === "q" || listenerMusic) frame.append(el("div", { class: "bar" },
      el("button", { onclick: () => { listenerMusic = !listenerMusic; render(); } },
        listenerMusic ? "Geluid uit" : "Geluid aan")));
    if (liveStatus) frame.append(el("p", { role: "status" }, liveStatus));
    return frame;
  }
  return el("div", { class: "show watching" }, el("div", { class: "center" },
    el("h1", {}, "Jaarquiz live"),
    el("p", { role: "status" }, liveStatus || "Wachten tot de presentator begint…")));
}
function bonusPortrait(photo, alt, previous){
  return el("div", { class: "bonus-portrait" },
    previous ? el("img", { class: "bonus-photo", src: previous, alt: "", "aria-hidden": "true" }) : null,
    el("img", { class: previous ? "bonus-photo incoming" : "bonus-photo", src: photo, alt }));
}
function renderFrame(sl, host){
  const wrap = el("div", { class: host ? "show" : "show watching",
    onclick: host ? (e) => { if (!e.target.closest("button, select, option") && view === "present") step(1); } : null });
  if (sl.type === "bonusSilhouette" || (sl.type === "bonusWinner" && sl.bonus.pokemon)){
    const answer = sl.type === "bonusWinner";
    wrap.append(el("div", { class: "center" }, el("div", { class: "pokemon-panel" + (answer ? " answer" : " entrance") },
      el("div", { class: "bonus-art" },
        el("img", { src: sl.bonus.pokemon, alt: answer ? "It’s " + sl.bonus.name + "!" : "Who’s That Pokémon?" })),
      answer ? null : el("div", { class: "bonus-ball", "aria-hidden": "true" }, el("span", {})),
      answer ? null : el("div", { class: "bonus-flash", "aria-hidden": "true" }))));
  } else if (sl.type === "bonusAge"){
    wrap.append(el("div", { class: "center" }, bonusPortrait(sl.photo, "Wie is dit?", sl.previous)));
  } else if (sl.type === "bonus" || sl.type === "bonusWinner"){
    const reveal = sl.type === "bonusWinner" && (!host || !drumming);
    wrap.append(el("div", { class: "center" }, reveal
      ? [bonusPortrait(sl.bonus.photo, sl.bonus.name, (sl.bonus.ages || []).filter(Boolean).at(-1)),
        el("h1", { class: "bonus-winner" }, "#1 " + sl.bonus.name.toUpperCase())]
      : [el("div", { class: "kicker" }, "Uitslag"), el("h1", {}, sl.bonus.question),
        host && drumming ? el("div", { class: "big" }, "🥁🥁🥁") : null]));
  } else if (sl.type === "intro"){
    wrap.append(el("div", { class: "center" },
      el("div", { class: "big" }, "🎬🥁🍿"),
      el("h1", {}, sl.title || "Jaarquiz ✨🤖"),
      el("p", {}, `${sl.participants} jaargenoten hebben gestemd 🗳️💯 · ${sl.total} vragen 🧠`),
      el("p", {}, host ? "De wachtkamer is open. Tik op Verder om te beginnen." : "De presentator bepaalt wanneer we verdergaan.")));
  } else if (sl.type === "q"){
    const ol = el("ol", {});
    const firstVisible = sl.rows.findIndex(Boolean);
    sl.rows.forEach((row, i) => {
      const place = el("span", { class: "p", "aria-label": `Plaats ${i + 1}` }, row ? ["🥇","🥈","🥉"][i] : `#${i + 1}`);
      if (!row){
        const drum = i === 0 && sl.drumming;
        ol.append(el("li", { class: drum ? "hidden drum" : "hidden" }, place, drum ? "🥁🥁🥁 …" : "❓"));
        return;
      }
      const winner = i === 0;
      ol.append(el("li", { class: (winner ? "win " : "") + (i === firstVisible ? "new" : "") },
        place, av(row.name), el("strong", {}, row.name)));
    });
    wrap.append(
      el("div", { class: "kicker" }, `Vraag ${sl.number} van ${sl.total} 🎯`),
      el("h1", {}, sl.text),
      el("div", { class: "labels" }, el("span", { class: "top" }, "⬆️ " + (sl.top || "meest"))),
      ol);
  } else if (sl.type === "awards"){
    const list = el("div", { class: "center", style: "gap:1.6vh" }, el("h1", {}, "🏆 De prijzen 🏆✨"));
    const shown = sl.awards.filter(Boolean).length;
    sl.awards.forEach((a, i) => list.append(a
      ? el("div", { class: "award" + (i === shown - 1 ? " new" : "") }, el("span", {}, a.e), el("div", {}, a.t, el("div", { class: "what" }, a.what)), el("span", { style: "margin-left:auto;display:flex;align-items:center;gap:1vw" }, av(a.name), a.name))
      : el("div", { class: "award hidden" }, el("span", {}, "❓"), "…")));
    wrap.append(list);
  } else {
    wrap.append(el("div", { class: "center" },
      el("div", { class: "big" }, "🍻🫶🎉"),
      el("h1", {}, "Proost, jaargenoten! ✨"),
      el("p", {}, "Tot de volgende jaarquiz 🚀🤖💯")));
  }
  return wrap;
}
window.addEventListener("keydown", (e) => {
  if (view !== "present" || drumming || e.repeat) return;
  if (e.target.closest?.("button, a, select, option") && [" ", "Enter"].includes(e.key)) return;
  if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)){ e.preventDefault(); step(1); }
  if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)){ e.preventDefault(); step(-1); }
  if (e.key === "Escape") stopPresentation();
  if (e.key === "n" || e.key === "N"){
    if (slides[si].bonus){ step(1); return; }
    // jump to the start of the next question (or the awards)
    const cur = slides[si];
    let j = si + 1;
    while (j < slides.length - 1 && !(slides[j].type !== "q" || (slides[j].shown === 0 && slides[j].res !== (cur && cur.res)))) j++;
    if (j < slides.length){ si = j; showFrame(); }
  }
});

/* ---------- boot ---------- */
(async () => {
  if (ADMIN){
    await loadAdmin();
    if (PRESENT && view === "admin" && admin?.exists){ buildSlides(); hostMusic = true; view = "present"; showFrame(); return; }
    render(); return;
  }
  if (!CODE){ view = "nocode"; render(); return; }
  try{ quiz = await api("GET", `/${encodeURIComponent(CODE)}`); }
  catch(e){ view = "nocode"; errorMsg = e.code === "quiz_not_found" ? "" : e.message; render(); return; }
  document.title = quiz.title || "Jaarquiz";
  if (LIVE){ render(); await pollLive(); return; }
  session = store(KEY);
  if (session?.token){
    try{
      mine = await api("GET", `/${encodeURIComponent(CODE)}/me`, undefined, { "X-Quiz-Token": session.token });
    }catch(e){ if (e.status === 401){ store(KEY, null); session = null; } else errorMsg = e.message; }
  }
  if (session && mine){
    if (quiz.revealed){ await loadResults(); view = "results"; }
    else { view = mine.done ? "done" : "q"; qi = firstOpen(); }
  } else view = "intro";
  render();
  await pollLive();
})();
