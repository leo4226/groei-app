<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jaarquiz</title>
<!--
  Jaarquiz — a ranking quiz for a group of friends. Standalone on purpose: it
  is not part of the plant app and loads nothing from it, and it loads no
  third-party scripts, because this page shares floreren.app's origin (and so
  the admin's login token in localStorage).
  Backend: backend/routers/jaarquiz.py. Names, photos and questions come from
  the database (the repo is public), loaded by the admin at #beheer.
  Participants: /jaarquiz#<invite code>. Dutch only: it is a private party game.
-->
<style>
  :root{
    --bg:#14121f; --panel:#1e1b2e; --panel2:#272340; --line:#36315a;
    --text:#f3f0ff; --muted:#a39dc4; --accent:#ffcc4d; --accent2:#ff6f91; --good:#5ee6a8;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  nav button.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
  h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px;font-weight:800}
  h2{font-size:18px;margin:0 0 10px;font-weight:700}
  p{color:var(--muted);line-height:1.5;margin:0 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .btn{background:var(--accent);color:#1b1630;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.small{width:auto;padding:7px 12px;font-size:13px}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .pick{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:10px;font:inherit;font-size:15px;cursor:pointer;text-align:left}
  .pick.on{border-color:var(--accent);background:#3a3050}
  .pick:disabled{opacity:.35;cursor:default}
  .pick small{color:var(--muted);font-size:12px;margin-left:auto}
  .av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text)}
  .progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .qnum{color:var(--accent);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
  .sub{color:var(--accent);font-weight:600}
  .rank{display:grid;grid-template-columns:30px 1fr;gap:8px;margin-bottom:6px}
  .nums,.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .nums li{height:50px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
  .nums li:first-child{color:var(--accent)}
  .nums li:last-child{color:var(--accent2)}
  .list{position:relative}
  .list li{height:50px;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 10px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;position:relative}
  .list li.dragging{z-index:5;border-color:var(--accent);background:#3a3050;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:grabbing}
  .list li.shift{transition:transform .15s}
  .list li .grip{color:var(--muted);font-size:18px;line-height:1}
  .list li .nm{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list li .mv{background:transparent;border:0;color:var(--muted);font-size:14px;width:32px;height:40px;border-radius:8px;cursor:pointer;touch-action:manipulation}
  .list li .mv:active{background:var(--line)}
  .list li.me .nm::after{content:" (jij)";color:var(--muted);font-weight:400;font-size:13px}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 14px 38px}
  .err{background:#4a1f2e;border:1px solid var(--accent2);color:#ffd6e0;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
  .note{background:#2b2540;border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
  .big{font-size:56px;text-align:center;margin:10px 0}
  .res{list-style:none;margin:0;padding:0}
  .res li{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:5px 0}
  .res .pos{font-weight:800;color:var(--muted);text-align:center}
  .res li:first-child .pos{color:var(--accent)}
  .res .barwrap{position:relative;height:30px;background:var(--panel2);border-radius:8px;overflow:hidden}
  .res .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4b3f7a,#6a55b0);border-radius:8px}
  .res li:first-child .bar{background:linear-gradient(90deg,#b8862a,var(--accent))}
  .res .who{display:flex;align-items:center;gap:8px;position:relative;height:30px;padding-left:4px;font-weight:600;font-size:14px}
  .res .who .av{width:24px;height:24px;font-size:11px}
  .res li:first-child .who{color:#1b1630}
  .res .avg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .meta{font-size:13px;color:var(--muted);margin-top:10px}
  .meta b{color:var(--text)}
  textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
  .toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin:6px 0 12px}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.r{text-align:right;color:var(--muted)}
  .ok{color:var(--good)!important}
  code.link{display:block;word-break:break-all;background:var(--panel2);padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(10,8,20,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
  .modal .box{background:var(--panel);border:2px solid var(--accent2);border-radius:18px;padding:24px 20px;max-width:340px;text-align:center;animation:shake .45s}
  .modal .box .big{margin:0 0 6px}
  .modal .box h2{font-size:24px;margin:0 0 16px}
  /* Question screen: one phone screen, no scrolling. The list takes whatever
     height is left and its ten rows share it (30-64 px each), so it fits an
     iPhone SE as well as a Pro Max. Numbers and names are two columns of
     equal flex rows, so they stay aligned at any height. */
  body.qmode .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}
  body.qmode header{margin-bottom:8px}
  body.qmode .logo{font-size:16px}
  body.qmode main{flex:1;min-height:0;display:flex;flex-direction:column}
  .qview{flex:1;min-height:0;display:flex;flex-direction:column}
  .qview .progress{margin-bottom:8px;flex:none}
  .qview .qnum{font-size:12px}
  .qview h1{font-size:clamp(19px,5.6vw,25px);margin:2px 0 8px}
  .qview .sub{margin:-4px 0 8px}
  .qview .rank{flex:1;min-height:0;margin-bottom:4px}
  .qview .nums,.qview .list{height:100%;gap:5px}
  .qview .nums li,.qview .list li{height:auto;flex:1 1 0;min-height:30px;max-height:64px}
  .qview .list li .av{width:28px;height:28px}
  .qview .ends{margin:0 0 8px 38px;flex:none}
  .qview .row .btn{padding:12px 14px}
  .qview .row{flex:none}
  .ends .top{color:var(--accent);font-weight:700}
  .ends .bottom{color:var(--accent2);font-weight:700}
  .qnum .drag{float:right;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  /* Presentation mode (#presenteer): Leon's laptop or a TV on quiz night. */
  body.present{background:radial-gradient(1200px 700px at 50% -10%,#3a2a6a 0%,var(--bg) 60%);overflow:hidden}
  body.present .wrap{max-width:none;height:100vh;height:100dvh;padding:2.5vh 4vw;display:flex;flex-direction:column}
  body.present header{display:none}
  body.present main{flex:1;min-height:0;display:flex;flex-direction:column}
  .show{flex:1;min-height:0;display:flex;flex-direction:column;user-select:none;cursor:pointer}
  .show .kicker{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(14px,1.6vw,22px)}
  .show h1{font-size:clamp(28px,4.2vw,64px);margin:.6vh 0 1.6vh;line-height:1.08}
  .show .labels{display:flex;justify-content:space-between;font-size:clamp(14px,1.5vw,22px);margin-bottom:1vh}
  .show .labels .top{color:var(--accent);font-weight:700}
  .show .labels .bottom{color:var(--accent2);font-weight:700}
  .show ol{list-style:none;margin:0;padding:0;flex:1;min-height:0;display:flex;flex-direction:column;gap:.8vh}
  .show ol li{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:1.4vw;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:0 1.6vw;font-size:clamp(16px,3.1vh,42px);font-weight:700;transition:transform .35s,background .35s}
  .show ol li .p{width:2.4em;color:var(--muted);font-weight:800}
  .show ol li .av{width:clamp(28px,4.6vh,64px);height:clamp(28px,4.6vh,64px);font-size:clamp(12px,2vh,26px)}
  .show ol li .a{margin-left:auto;color:var(--muted);font-weight:500;font-size:.8em}
  .show ol li.hidden{color:var(--muted);background:transparent;border-style:dashed}
  .show ol li.new{animation:pop .45s}
  .show ol li.win{background:linear-gradient(90deg,#b8862a,var(--accent));color:#1b1630;border-color:var(--accent);transform:scale(1.02)}
  .show ol li.win .p,.show ol li.win .a{color:#1b1630}
  .show ol li.drum{animation:drum .12s infinite;color:var(--accent)}
  .show .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
  .show .center h1{font-size:clamp(36px,6vw,96px)}
  .show .center p{font-size:clamp(16px,2vw,28px)}
  .show .award{display:flex;align-items:center;gap:2vw;font-size:clamp(18px,2.6vw,38px);font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:2vh;padding:1.6vh 2vw;width:min(90vw,1100px)}
  .show .award .what{color:var(--muted);font-weight:500;font-size:.7em}
  .show .award .av{width:clamp(36px,6vh,80px);height:clamp(36px,6vh,80px)}
  .show .award.hidden{opacity:.25}
  .show .bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(12px,1.3vw,18px);margin-top:1.2vh}
  .show .bar button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:.6vh 1.4vw;font:inherit;cursor:pointer}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  @keyframes drum{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">Jaar<span>.</span>quiz ✨🤖</div>
    <nav id="nav"></nav>
  </header>
  <main id="app"><div class="card"><p>Laden…</p></div></main>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<script>
"use strict";
const ERRORS = {
  quiz_not_found: "Deze quizlink klopt niet (meer). Vraag om de nieuwe link.",
  voter_taken: "Die naam is al gekozen. Ben jij het echt? Vraag dan de beheerder om hem vrij te geven.",
  unknown_voter: "Die naam staat niet in de quiz.",
  token_invalid: "Je sessie is verlopen of je naam is vrijgegeven. Kies je naam opnieuw.",
  token_required: "Kies eerst wie je bent.",
  invalid_order: "Er ging iets mis met de volgorde. Herlaad de pagina.",
  quiz_closed: "De uitslag is al bekend, dus je kunt niets meer aanpassen.",
  not_revealed: "De uitslag is nog geheim.",
  config_too_large: "De configuratie is te groot (te veel of te grote foto's).",
};

/* ---------- helpers ---------- */
const app = document.getElementById("app"), navEl = document.getElementById("nav");
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function store(key, val){ try{ if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return null; } }

async function api(method, path, body, headers){
  const res = await fetch("/api/jaarquiz" + path, {
    method, headers: { "Content-Type": "application/json", ...(headers || {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try{ data = await res.json(); }catch(e){}
  if (!res.ok){
    const code = data && typeof data.detail === "string" ? data.detail : "";
    const err = new Error(ERRORS[code] || (res.status === 401 || res.status === 403 ? "Geen toegang." : "Er ging iets mis (" + res.status + "). Probeer het zo nog eens."));
    err.status = res.status; err.code = code; throw err;
  }
  return data;
}

/* ---------- confetti: canvas, no library ---------- */
const SLOP = ["✨", "🚀", "💯", "🔥", "🤖", "🧠", "🙌", "🫶", "🌈", "🎉", "⚡", "💅", "🗿", "🦄", "🍾"];
function confetti(ms = 3800){
  const c = document.getElementById("confetti");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext("2d");
  const colors = ["#ffcc4d", "#ff6f91", "#5ee6a8", "#7aa2ff", "#c792ea"];
  const n = reduce ? 40 : 170;
  const parts = Array.from({ length: n }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5,
    vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    s: 7 + Math.random() * 8, col: colors[Math.floor(Math.random() * colors.length)],
    emoji: Math.random() < .35 ? SLOP[Math.floor(Math.random() * SLOP.length)] : null,
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of parts){
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.emoji){ ctx.font = (p.s * 2.2) + "px system-ui"; ctx.fillText(p.emoji, 0, 0); }
      else { ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      ctx.restore();
    }
    if (t - t0 < ms) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}
/* drumroll + crash, synthesized (no audio files to load) */
let audio = null;
function drumroll(seconds = 1.6){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audio, now = ctx.currentTime;
    const noise = ctx.createBuffer(1, ctx.sampleRate * .08, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const hit = (at, vol, len = .08) => {
      const src = ctx.createBufferSource(); src.buffer = noise;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900;
      const g = ctx.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + len);
      src.connect(f).connect(g).connect(ctx.destination); src.start(at); src.stop(at + len);
    };
    for (let t = 0; t < seconds; t += .045) hit(now + t, .15 + .35 * (t / seconds));
    const crash = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
    const cd = crash.getChannelData(0); for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / cd.length, 2);
    const src = ctx.createBufferSource(); src.buffer = crash;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
    const g = ctx.createGain(); g.gain.value = .5;
    src.connect(hp).connect(g).connect(ctx.destination); src.start(now + seconds);
  }catch(e){}
}

/* ---------- state ---------- */
const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
const PRESENT = hash === "presenteer";
const ADMIN = hash === "beheer" || PRESENT;
const CODE = ADMIN ? "" : hash;
const KEY = "jaarquiz:" + CODE;

let quiz = null;        // {title, people, questions, liar, revealed, taken}
let session = null;     // {token, voter}
let mine = null;        // {voter, answers, done}
let drafts = {};
let view = "loading", qi = 0, picked = null, errorMsg = "", busy = false;
let results = null, admin = null;
let liarDone = !!store("jaarquiz:liar");

const photos = () => Object.fromEntries((quiz?.people || []).map(p => [p.name, p.photo]));
function av(n){ const ph = photos()[n]; return ph ? el("img", { class: "av", src: ph, alt: "" }) : el("span", { class: "av" }, String(n).slice(0, 1).toUpperCase()); }
const names = () => (quiz?.people || []).map(p => p.name);
const optionsFor = q => q.options || names();
const firstOpen = () => { const i = quiz.questions.findIndex(q => !(mine?.answers && Array.isArray(mine.answers[q.id]))); return i < 0 ? 0 : i; };
function cleanOrder(order, opts){
  const out = [];
  (Array.isArray(order) ? order : []).forEach(n => { if (opts.includes(n) && !out.includes(n)) out.push(n); });
  opts.forEach(n => { if (!out.includes(n)) out.push(n); });
  return out;
}

/* ---------- render ---------- */
function renderNav(){
  navEl.replaceChildren();
  if (ADMIN || !quiz || !session) return;
  const tabs = [["fill", "Invullen"]];
  if (quiz.revealed) tabs.push(["results", "Uitslag"]);
  if (tabs.length < 2) return;
  tabs.forEach(([v, label]) => {
    const on = (v === "fill" && ["intro", "q", "done"].includes(view)) || v === view;
    navEl.append(el("button", { class: on ? "on" : "", onclick: () => go(v) }, label));
  });
}
function render(){
  document.body.classList.toggle("qmode", view === "q");
  document.body.classList.toggle("present", view === "present");
  renderNav();
  const fns = { loading: vLoading, nocode: vNoCode, intro: vIntro, q: vQuestion, done: vDone, results: vResults, admin: vAdmin, adminLogin: vAdminLogin, present: vPresent };
  app.replaceChildren(...[].concat(errorMsg ? el("div", { class: "err" }, errorMsg) : [], fns[view]()));
}
async function go(v){
  errorMsg = "";
  if (v === "results"){ await loadResults(); view = "results"; }

/* drag to reorder: pointer events, no library */
function makeSortable(list, onChange){
  let drag = null;
  list.addEventListener("pointerdown", ev => {
    if (ev.target.closest(".mv")) return;
    const li = ev.target.closest("li"); if (!li) return;
    ev.preventDefault();
    const items = [...list.children];
    const rects = items.map(x => x.getBoundingClientRect());
    drag = { li, startY: ev.clientY, from: items.indexOf(li), to: items.indexOf(li), items, rects, step: rects.length > 1 ? rects[1].top - rects[0].top : 56 };
    li.classList.add("dragging"); li.setPointerCapture(ev.pointerId);
    items.forEach(x => { if (x !== li) x.classList.add("shift"); });
  });
  list.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dy = ev.clientY - drag.startY;
    const n = drag.items.length;
    const to = Math.max(0, Math.min(n - 1, drag.from + Math.round(dy / drag.step)));
    drag.li.style.transform = `translateY(${dy}px)`;
    if (to !== drag.to){
      drag.to = to;
      drag.items.forEach((x, i) => {
        if (x === drag.li) return;
        let shift = 0;
        if (drag.from < to && i > drag.from && i <= to) shift = -drag.step;
        if (drag.from > to && i < drag.from && i >= to) shift = drag.step;
        x.style.transform = shift ? `translateY(${shift}px)` : "";
      });
    }
  });
  const end = () => {
    if (!drag) return;
    const { li, from, to, items } = drag; drag = null;
    items.forEach(x => { x.style.transform = ""; x.classList.remove("shift", "dragging"); });
    if (to !== from){
      const ref = items.filter(x => x !== li)[to];
      list.insertBefore(li, ref || null);
      onChange();
    }
  };
  list.addEventListener("pointerup", end);
  list.addEventListener("pointercancel", end);
}

function vQuestion(){
  const q = quiz.questions[qi];
  const opts = optionsFor(q);
  const order = drafts[q.id] || cleanOrder(mine.answers[q.id] || shuffle(opts), opts);
  drafts[q.id] = order;
  const nums = el("ol", { class: "nums" }, order.map((_, i) => el("li", {}, i + 1)));
  const list = el("ul", { class: "list" });
  const liar = quiz.liar && !q.options ? quiz.liar.name : null;
  let prev = order.slice();
  const sync = () => {
    const cur = [...list.children].map(li => li.dataset.name);
    if (liar && !liarDone && cur[cur.length - 1] === liar && prev[prev.length - 1] !== liar){
      markLiar(); drafts[q.id] = prev; render(); showLiar(); return;
    }
    drafts[q.id] = cur; prev = cur.slice();
  };
  const move = (li, dir) => {
    const sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
    if (!sib) return;
    dir < 0 ? list.insertBefore(li, sib) : list.insertBefore(sib, li);
    sync();
  };
  order.forEach(n => {
    const up = el("button", { class: "mv", "aria-label": "omhoog" }, "▲");
    const down = el("button", { class: "mv", "aria-label": "omlaag" }, "▼");
    const li = el("li", { class: (!q.options && n === mine.voter) ? "me" : "", "data-name": n },
      el("span", { class: "grip" }, "⠿"), av(n), el("span", { class: "nm" }, n), up, down);
    up.addEventListener("click", e => { e.stopPropagation(); move(li, -1); });
    down.addEventListener("click", e => { e.stopPropagation(); move(li, 1); });
    list.append(li);
  });
  makeSortable(list, sync);

  const last = qi === quiz.questions.length - 1;
  const next = async dir => {
    sync();
    const cur = drafts[q.id];
    if (dir > 0 && liar && !liarDone && cur[cur.length - 1] === liar){ markLiar(); showLiar(); return; }
    const answers = { ...mine.answers, [q.id]: cur.slice() };
    busy = true; errorMsg = "";
    try{
      mine = await api("PUT", `/${encodeURIComponent(CODE)}/me`, { answers, done: dir > 0 && last }, { "X-Quiz-Token": session.token });
    }catch(e){
      busy = false; errorMsg = e.message;
      if (e.code === "token_invalid"){ store(KEY, null); session = null; mine = null; view = "intro"; }
      render(); return;
    }
    busy = false;
    if (dir > 0 && last){
      if (mine.done){ view = "done"; setTimeout(() => confetti(), 50); }
      else { qi = firstOpen(); errorMsg = "Je hebt nog niet alle vragen ingevuld."; }
    } else qi = Math.max(0, Math.min(quiz.questions.length - 1, qi + dir));
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  };
  return el("div", { class: "qview" },
    el("div", { class: "progress" }, el("div", { style: `width:${(qi / quiz.questions.length) * 100}%` })),
    el("div", { class: "qnum" }, `Vraag ${qi + 1} van ${quiz.questions.length} ✨`, el("span", { class: "drag" }, "sleep 👆 of ▲▼")),
    el("h1", {}, q.text),
    q.sub ? el("p", { class: "sub" }, q.sub) : null,
    el("div", { class: "rank" }, nums, list),
    el("div", { class: "ends" }, el("span", { class: "top" }, "⬆️ " + (q.top || "meest")), el("span", { class: "bottom" }, (q.bottom || "minst") + " ⬇️")),
    el("div", { class: "row" },
      el("button", { class: "btn ghost", disabled: qi === 0 || busy, onclick: () => next(-1) }, "⬅️ Vorige"),
      el("button", { class: "btn", disabled: busy, onclick: () => next(1) }, last ? "Insturen 🚀🎉💯" : "Volgende ➡️✨")));
}

/* ---------- presentation (#presenteer) ---------- */
/* One step per tap: each question reveals its places from last to first,
   with a drumroll before #1; then the awards one by one. Admin data, so it
   works before the results are revealed to everyone. */
let slides = [], si = 0, drumming = false;
function buildSlides(){
  const R = admin.results, Q = admin.config.questions;
  slides = [{ type: "intro" }];
  R.questions.forEach(res => {
    const q = Q.find(x => x.id === res.id); if (!q || !res.rows.length) return;
    for (let k = 0; k <= res.rows.length; k++) slides.push({ type: "q", res, q, shown: k });
  });
  const own = R.questions.filter(r => !(Q.find(q => q.id === r.id) || {}).options);
  const count = (pick) => { const c = {}; own.forEach(r => { const row = pick(r.rows); if (row) c[row.name] = (c[row.name] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]; };
  const first = count(rows => rows[0]), lastc = count(rows => rows[rows.length - 1]);
  let split = null;
  R.questions.forEach(r => r.rows.forEach(row => { const d = row.max - row.min; if (!split || d > split.d) split = { d, row, q: Q.find(q => q.id === r.id) }; }));
  const sk = R.self_knowledge;
  const awards = [];
  if (first) awards.push({ e: "🏆👑", t: "Vaakst op #1", name: first[0], what: `${first[1]}× bovenaan` });
  if (lastc) awards.push({ e: "🧊🫠", t: "Vaakst onderaan", name: lastc[0], what: `${lastc[1]}× op de laatste plek` });
  if (split) awards.push({ e: "🔥🤯", t: "Meeste ruzie", name: split.row.name, what: `van #${split.row.min} tot #${split.row.max} bij "${split.q ? split.q.text : ""}"` });
  if (sk.length) awards.push({ e: "🪞🧘", t: "Kent zichzelf het best", name: sk[0].name, what: `${sk[0].off_by.toFixed(1)} plekken ernaast` });
  if (sk.length > 1) awards.push({ e: "🤡🌈", t: "Leeft in een droomwereld", name: sk[sk.length - 1].name, what: `${sk[sk.length - 1].off_by.toFixed(1)} plekken ernaast` });
  for (let k = 0; k <= awards.length; k++) slides.push({ type: "awards", awards, shown: k });
  slides.push({ type: "end" });
}
function step(dir){
  if (drumming) return;
  const nextI = Math.max(0, Math.min(slides.length - 1, si + dir));
  if (nextI === si) return;
  const s2 = slides[nextI];
  // the step that reveals #1: drumroll first
  if (dir > 0 && s2.type === "q" && s2.shown === s2.res.rows.length){
    drumming = true; si = nextI; render(); drumroll(1.6);
    setTimeout(() => { drumming = false; render(); confetti(4200); }, 1600);
    return;
  }
  si = nextI; render();
  if (dir > 0 && s2.type === "end") confetti(6000);
}
function vPresent(){
  const sl = slides[si];
  const wrap = el("div", { class: "show", onclick: (e) => { if (!e.target.closest("button")) step(1); } });
  const bar = el("div", { class: "bar" },
    el("button", { onclick: (e) => { e.stopPropagation(); step(-1); } }, "⬅️ terug"),
    el("span", {}, `${si + 1} / ${slides.length} · spatie of → = verder · N = volgende vraag ✨`),
    el("button", { onclick: (e) => { e.stopPropagation(); location.hash = "beheer"; } }, "✖️ stop"));
  if (sl.type === "intro"){
    wrap.append(el("div", { class: "center" },
      el("div", { class: "big" }, "🎬🥁🍿"),
      el("h1", {}, admin.config.title || "Jaarquiz ✨🤖"),
      el("p", {}, `${admin.results.participants} jaargenoten hebben gestemd 🗳️💯 · ${admin.results.questions.length} vragen 🧠`),
      el("p", {}, "Tik of druk op spatie om te beginnen 🚀")));
  } else if (sl.type === "q"){
    const n = sl.res.rows.length, idx = admin.config.questions.indexOf(sl.q);
    const revealFrom = n - sl.shown; // rows with index >= revealFrom are visible
    const ol = el("ol", {});
    sl.res.rows.forEach((r, i) => {
      const visible = i >= revealFrom;
      const isWin = i === 0 && visible;
      const isNew = visible && i === revealFrom;
      if (i === 0 && drumming){ ol.append(el("li", { class: "hidden drum" }, el("span", { class: "p" }, "#1"), "🥁🥁🥁 …")); return; }
      ol.append(visible
        ? el("li", { class: (isWin ? "win " : "") + (isNew ? "new" : "") }, el("span", { class: "p" }, `#${i + 1}`), av(r.name), r.name + (isWin ? " 👑🔥" : ""), el("span", { class: "a" }, `gem. ${r.avg.toFixed(1)}`))
        : el("li", { class: "hidden" }, el("span", { class: "p" }, `#${i + 1}`), "❓"));
    });
    wrap.append(
      el("div", { class: "kicker" }, `Vraag ${idx + 1} van ${admin.config.questions.length} 🎯`),
      el("h1", {}, sl.q.text),
      el("div", { class: "labels" }, el("span", { class: "top" }, "⬆️ " + (sl.q.top || "meest")), el("span", { class: "bottom" }, (sl.q.bottom || "minst") + " ⬇️")),
      ol);
  } else if (sl.type === "awards"){
    const list = el("div", { class: "center", style: "gap:1.6vh" }, el("h1", {}, "🏆 De prijzen 🏆✨"));
    sl.awards.forEach((a, i) => list.append(i < sl.shown
      ? el("div", { class: "award" + (i === sl.shown - 1 ? " new" : "") }, el("span", {}, a.e), el("div", {}, a.t, el("div", { class: "what" }, a.what)), el("span", { style: "margin-left:auto;display:flex;align-items:center;gap:1vw" }, av(a.name), a.name))
      : el("div", { class: "award hidden" }, el("span", {}, "❓"), "…")));
    wrap.append(list);
  } else {
    wrap.append(el("div", { class: "center" },
      el("div", { class: "big" }, "🍻🫶🎉"),
      el("h1", {}, "Proost, jaargenoten! ✨"),
      el("p", {}, "Tot de volgende jaarquiz 🚀🤖💯")));
  }
  wrap.append(bar);
  return wrap;
}
window.addEventListener("keydown", (e) => {
  if (view !== "present") return;
  if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)){ e.preventDefault(); step(1); }
  if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)){ e.preventDefault(); step(-1); }
  if (e.key === "Escape") location.hash = "beheer";
  if (e.key === "n" || e.key === "N"){
    // jump to the start of the next question (or the awards)
    const cur = slides[si];
    let j = si + 1;
    while (j < slides.length - 1 && !(slides[j].type !== "q" || (slides[j].shown === 0 && slides[j].res !== (cur && cur.res)))) j++;
    si = j; render();
  }
});

  if (ADMIN){
    await loadAdmin();
    if (PRESENT && view === "admin" && admin?.exists){ buildSlides(); view = "present"; }
    render(); return;
  }
  if (!CODE){ view = "nocode"; render(); return; }
  try{ quiz = await api("GET", `/${encodeURIComponent(CODE)}`); }
  catch(e){ view = "nocode"; errorMsg = e.code === "quiz_not_found" ? "" : e.message; render(); return; }
  document.title = quiz.title || "Jaarquiz";
  session = store(KEY);
  if (session?.token){
    try{
      mine = await api("GET", `/${encodeURIComponent(CODE)}/me`, undefined, { "X-Quiz-Token": session.token });
    }catch(e){ if (e.status === 401){ store(KEY, null); session = null; } else errorMsg = e.message; }
  }
  if (session && mine){
    if (quiz.revealed){ await loadResults(); view = "results"; }
    else { view = mine.done ? "done" : "q"; qi = firstOpen(); }
  } else view = "intro";
  render();
})();
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
