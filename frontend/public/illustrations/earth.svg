<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Planeet aarde">
  <title>Planeet aarde — vereenvoudigd</title>
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.013" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="globe"><circle cx="400" cy="400" r="270"/></clipPath>
  </defs>

  <!-- cream background -->
  <rect width="800" height="800" fill="#F3EAD6"/>

  <g filter="url(#rough)" stroke-linejoin="round" stroke-linecap="round">
    <!-- ocean disc (single flat blue) -->
    <circle cx="400" cy="400" r="270" fill="#7FA6B4" stroke="#4A3B2A" stroke-width="12"/>

    <!-- continents: simple flat green shapes, clipped to the globe -->
    <g clip-path="url(#globe)">
      <!-- upper-left landmass -->
      <path d="M 190 250 Q 260 190 340 230 Q 380 260 350 320 Q 320 370 250 360 Q 180 350 170 300 Q 168 268 190 250 Z"
            fill="#8FA65B"/>
      <path d="M 250 250 Q 300 240 320 280 Q 300 320 260 315 Q 220 305 230 275 Z" fill="#7C9349"/>

      <!-- right landmass -->
      <path d="M 460 210 Q 560 220 600 300 Q 620 360 560 400 Q 520 425 470 400 Q 430 370 445 320 Q 430 260 460 210 Z"
            fill="#8FA65B"/>
      <path d="M 500 280 Q 560 290 575 335 Q 560 375 515 365 Q 480 350 490 315 Z" fill="#7C9349"/>

      <!-- lower landmass -->
      <path d="M 320 470 Q 420 450 470 500 Q 500 545 450 585 Q 390 615 330 585 Q 285 555 300 510 Q 305 485 320 470 Z"
            fill="#96AB63"/>
      <path d="M 360 500 Q 420 495 440 530 Q 420 565 375 560 Q 335 548 345 520 Z" fill="#7C9349"/>

      <!-- small island -->
      <path d="M 560 480 Q 600 475 610 505 Q 600 535 565 530 Q 540 520 548 498 Z" fill="#8FA65B"/>
    </g>

    <!-- outline ring redrawn on top so it stays crisp over the land -->
    <circle cx="400" cy="400" r="270" fill="none" stroke="#4A3B2A" stroke-width="12"/>
  </g>

  <rect width="800" height="800" filter="url(#grain)" style="mix-blend-mode:overlay" opacity="0.30"/>
</svg>
