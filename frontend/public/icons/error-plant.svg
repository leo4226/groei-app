    <ellipse cx="28" cy="46" rx="8" ry="3.5" transform="rotate(-30 28 46)"/>
    <ellipse cx="72" cy="38" rx="7" ry="3" transform="rotate(25 72 38)"/>
    <ellipse cx="50" cy="32" rx="10" ry="4" transform="rotate(-10 50 32)"/>
  </g>

  <!-- Grote oranje vlammen -->
  <g fill="#E88A3D">
    <path d="M 34 50 Q 28 38 32 28 Q 34 22 38 28 Q 42 34 36 48 Z"/>
    <path d="M 64 42 Q 58 30 62 18 Q 64 12 68 18 Q 72 26 66 40 Z"/>
    <path d="M 50 34 Q 44 18 50 8 Q 52 2 54 8 Q 58 16 52 32 Z"/>
  </g>

  <!-- Rode binnen-vlammen -->
  <g fill="#D94A3D">
    <path d="M 36 46 Q 32 38 34 30 Q 35 26 38 30 Q 40 34 38 44 Z"/>
    <path d="M 66 38 Q 62 30 64 20 Q 65 16 68 20 Q 70 26 68 36 Z"/>
    <path d="M 52 30 Q 48 20 52 12 Q 53 8 55 12 Q 56 18 54 28 Z"/>
  </g>

  <!-- Kleine gele vlam-toppen (accent) -->
  <g fill="#F0C040">
    <path d="M 37 28 Q 36 24 38 22 Q 39 20 40 22 Q 41 24 39 28 Z" opacity="0.6"/>
    <path d="M 65 18 Q 64 14 66 12 Q 67 10 68 12 Q 69 14 67 18 Z" opacity="0.6"/>
    <path d="M 52 10 Q 51 6 53 4 Q 54 2 55 4 Q 56 6 54 10 Z" opacity="0.6"/>
  </g>

  <!-- Rookwolkjes (transparant bruin) -->
  <g fill="#4A3429" opacity="0.2">
    <circle cx="38" cy="18" r="3.5"/>
    <circle cx="60" cy="10" r="3"/>
    <circle cx="45" cy="4" r="2.5"/>
