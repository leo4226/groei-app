<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Fout"><title>Fout — Pagina niet geladen</title>
  <!-- Standaard Floreren terracotta pot -->
  <path d="M 28 76 L 32 96 Q 32 98 34 98 L 66 98 Q 68 98 68 96 L 72 76 Z" fill="#B2664A"/>
  <rect x="26" y="73" width="48" height="5" rx="1.5" fill="#C77B5D"/>
  <path d="M 32 96 Q 32 98 34 98 L 66 98 Q 68 98 68 96 L 66 94 L 34 94 Z" fill="#8E4A33" opacity="0.5"/>
  <ellipse cx="50" cy="75.5" rx="20" ry="1.8" fill="#4A3429"/>

  <!-- Verkoold stukje aarde -->
  <ellipse cx="50" cy="75.5" rx="18" ry="1.3" fill="#2A1A0E" opacity="0.4"/>

  <!-- Verkoolde stengel -->
  <path d="M 50 76 L 50 42" stroke="#3D2A1A" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 50 56 Q 38 50 30 48" stroke="#3D2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 50 48 Q 62 42 70 40" stroke="#3D2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Verschroeide bladeren (donkerbruin, slap hangend) -->
