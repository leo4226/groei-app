<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Seed"><title>Seed — Algemeen</title>

  <!-- Dashed ground line (same convention as lavender_bare, brownbean_bare) -->
  <path d="M 26 90 Q 50 88 74 90" stroke="#6B4A35" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="1.5 2"/>

  <!-- Disturbed soil mound where seed is planted -->
  <ellipse cx="50" cy="88" rx="16" ry="4" fill="#8B7355" opacity="0.45"/>

  <!-- Seed at soil surface -->
  <ellipse cx="50" cy="85" rx="7" ry="4.5" fill="#8B6240" transform="rotate(-12 50 85)"/>
  <ellipse cx="47.5" cy="83.5" rx="2.2" ry="1.4" fill="#B8894E" opacity="0.55" transform="rotate(-12 47.5 83.5)"/>
  <path d="M 43.5 84.5 Q 50 81.5 56.5 84.5" stroke="#5C3D1E" stroke-width="0.7" fill="none"/>

  <!-- Sprout stem -->
  <path d="M 50 82 L 50 63" stroke="#3D5C3A" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Cotyledon branches -->
  <path d="M 50 72 Q 43 70 40 65" stroke="#3D5C3A" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M 50 72 Q 57 70 60 65" stroke="#3D5C3A" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Left cotyledon -->
  <ellipse cx="38" cy="62" rx="7" ry="4.2" fill="#6DA86F" transform="rotate(-38 38 62)"/>

  <!-- Right cotyledon -->
  <ellipse cx="62" cy="62" rx="7" ry="4.2" fill="#4A7C4E" transform="rotate(38 62 62)"/>

  <!-- Apical bud -->
  <ellipse cx="50" cy="60.5" rx="2.5" ry="3.5" fill="#4A7C4E"/>

</svg>
