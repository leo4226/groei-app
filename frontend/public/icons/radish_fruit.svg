<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Radijs"><title>Radijs — Raphanus sativus</title>
  ${[-18,0,18].map(a=&gt;`
    <g transform="translate(50 38) rotate(${a})">
      <path d="M 0 0 L 0 -24" stroke="${C.stem}" stroke-width="1.2"></path>
