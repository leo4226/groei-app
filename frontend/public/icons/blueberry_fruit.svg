<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Blauwe Bes"><title>Blauwe Bes — Vaccinium corymbosum</title>
  <path d="M 50 82 Q 50 60 50 30" stroke="${C.stem}" stroke-width="1.4" fill="none"></path>
  <path d="M 50 54 Q 36 50 28 38 Q 40 36 50 46 Z" fill="${C.leafDark}"></path>
  <path d="M 50 40 Q 64 36 72 24 Q 60 22 50 32 Z" fill="${C.leafDark}"></path>
