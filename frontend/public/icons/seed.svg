<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Seed"><title>Seed — Algemeen</title>

  <!-- Standard terracotta pot (identical to all other potted icons) -->
  <path d="M 29 78 L 33 98 Q 33 100 35 100 L 65 100 Q 67 100 67 98 L 71 78 Z" fill="#B2664A"/>
  <rect x="27" y="75" width="46" height="5" rx="1.5" fill="#C77B5D"/>
  <path d="M 33 98 Q 33 100 35 100 L 65 100 Q 67 100 67 98 L 65 96 L 35 96 Z" fill="#8E4A33" opacity="0.5"/>
  <ellipse cx="50" cy="77.5" rx="19" ry="1.8" fill="#4A3429"/>

  <!-- Seed at soil surface -->
  <ellipse cx="50" cy="74" rx="7" ry="4.5" fill="#8B6240" transform="rotate(-12 50 74)"/>
  <ellipse cx="47.5" cy="72.5" rx="2.2" ry="1.4" fill="#B8894E" opacity="0.55" transform="rotate(-12 47.5 72.5)"/>
  <path d="M 43.5 73.5 Q 50 70.5 56.5 73.5" stroke="#5C3D1E" stroke-width="0.7" fill="none"/>

  <!-- Sprout stem -->
  <path d="M 50 71 L 50 52" stroke="#3D5C3A" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Cotyledon branches -->
  <path d="M 50 61 Q 43 59 40 54" stroke="#3D5C3A" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M 50 61 Q 57 59 60 54" stroke="#3D5C3A" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Left cotyledon -->
  <ellipse cx="38" cy="51" rx="7" ry="4.2" fill="#6DA86F" transform="rotate(-38 38 51)"/>

  <!-- Right cotyledon -->
  <ellipse cx="62" cy="51" rx="7" ry="4.2" fill="#4A7C4E" transform="rotate(38 62 51)"/>

  <!-- Apical bud (tiny first true leaves emerging) -->
  <ellipse cx="50" cy="49.5" rx="2.5" ry="3.5" fill="#4A7C4E"/>

</svg>
