# Project root fly.toml — build context includes whole repo so icons are available
app = "floreren-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary machine before the new release is rolled out.
  # If alembic fails the deploy aborts and existing machines stay alive.
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ICONS_DIR = "/app/icons"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
