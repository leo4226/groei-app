# Project root fly.toml — build context includes whole repo so icons are available
app = "floreren-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary machine before the new release is rolled out.
  # If alembic fails the deploy aborts and existing machines stay alive.
  # After migrations, (re)seed streek reference data and backfill the
  # streek/drachtplant enrichment from the committed snapshots — each step is
  # idempotent and best-effort (|| true) so a transient hiccup never aborts a
  # deploy, and new catalog species get enriched on the next deploy.
  release_command = "sh -c 'alembic upgrade head && (python -m scripts.seed_streken || true) && (python -m scripts.resolve_streek_species --no-gbif || true) && (python -m scripts.resolve_bloeibogen || true) && (python -m scripts.resolve_moth_plants || true) && (python -m scripts.resolve_soil_ph || true) && (python -m scripts.resolve_growth_form || true)'"

[env]
  PORT = "8000"
  ICONS_DIR = "/app/icons"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 0 = machine slaapt bij inactiviteit (geen vaste maandkosten); eerste request
  # na een stille periode heeft ~1s cold start. Digest-cron wekt hem via
  # auto_start (zie #137).
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
